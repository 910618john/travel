<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1f2328;--mut:#6b7280;--line:#e5e7eb;--acc:#0f766e;--acc2:#ccfbf1;--red:#dc2626;--warn:#d97706}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:calc(15px*var(--fz,1))/1.5 -apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif;padding-bottom:calc(70px + env(safe-area-inset-bottom))}

/* 長清單: 畫面外的卡片先不排版, 捲到才畫(大幅減少卡頓) */

/* iPhone Safari: 一般 div/tr 要有 cursor:pointer, 點擊才會傳到 document 的事件處理 */
[data-edit],[data-act],[data-tab],[data-f],[data-big],[data-say],[data-hit],[data-drag],[data-tip],[data-rmph],[data-d]{cursor:pointer;-webkit-tap-highlight-color:rgba(0,0,0,.06)}
main{padding-bottom:84px}
.pin{background:var(--acc);color:#fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:calc(13px*var(--fz,1));border:2px solid #fff;box-shadow:0 1px 4px #0006}

#offline{display:none;background:var(--warn);color:#fff;text-align:center;font-size:calc(13px*var(--fz,1));padding:3px}
body.off #offline{display:block}
.wx{font-weight:400;font-size:calc(13px*var(--fz,1));color:var(--mut)}

.cal{position:relative;margin-left:44px;border-left:1px solid var(--line)}
.calh{position:absolute;left:0;right:0;border-top:1px solid var(--line);height:0}

.c-景點{--cc:#0f766e}.c-住宿{--cc:#7c3aed}.c-美食{--cc:#c2410c}.c-交通{--cc:#1d4ed8}.c-購物{--cc:#be185d}.c-其他{--cc:#6b7280}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) :is(.c-景點){--cc:#2dd4bf}:root:not([data-theme="light"]) .c-住宿{--cc:#a78bfa}:root:not([data-theme="light"]) .c-美食{--cc:#fb923c}:root:not([data-theme="light"]) .c-交通{--cc:#60a5fa}:root:not([data-theme="light"]) .c-購物{--cc:#f472b6}:root:not([data-theme="light"]) .c-其他{--cc:#9ca3af}}
:root[data-theme="dark"] .c-景點{--cc:#2dd4bf}:root[data-theme="dark"] .c-住宿{--cc:#a78bfa}:root[data-theme="dark"] .c-美食{--cc:#fb923c}:root[data-theme="dark"] .c-交通{--cc:#60a5fa}:root[data-theme="dark"] .c-購物{--cc:#f472b6}:root[data-theme="dark"] .c-其他{--cc:#9ca3af}
.cale[class*="c-"]{border-left-color:var(--cc);background:color-mix(in srgb,var(--cc) 20%,var(--card))}
.ctag{background:color-mix(in srgb,var(--cc) 22%,transparent);color:var(--fg);font-size:calc(11px*var(--fz,1))}
.cdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--cc);margin-right:4px;vertical-align:middle}
.calt{font-size:calc(11px*var(--fz,1));color:var(--mut);font-variant-numeric:tabular-nums}
.calnow{position:absolute;left:-4px;right:0;border-top:2px solid var(--red);pointer-events:none}
.calnow::before{content:"";position:absolute;left:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.calu{padding:3px 0}
.calrs{position:absolute;left:0;right:0;bottom:0;height:9px;cursor:ns-resize}
.calrs::after{content:"";position:absolute;left:50%;bottom:3px;width:24px;height:3px;margin-left:-12px;border-radius:2px;background:var(--cc,var(--acc));opacity:.7}
.cale{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.caldrag{z-index:5;box-shadow:0 6px 18px #0006;opacity:.92}
.calban{border-left:4px solid var(--cc);background:color-mix(in srgb,var(--cc) 18%,var(--card));border-radius:8px;padding:6px 10px;margin-bottom:6px}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:10px}
.stile{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.simg{width:100%;aspect-ratio:1;object-fit:cover;background:var(--line);display:block}
.noimg,.sthumb.noimg{display:flex;align-items:center;justify-content:center;font-size:calc(40px*var(--fz,1));color:var(--mut)}
.sthumb{width:84px;height:84px;object-fit:cover;border-radius:10px;background:var(--line);flex:none}
.sthumb.noimg{font-size:calc(28px*var(--fz,1))}
.sbody{padding:8px 10px;flex:1}
.scheck{position:absolute;top:6px;left:6px;margin:0;background:var(--card);border-radius:6px;padding:3px 5px;line-height:1}
.stile.done .simg{filter:grayscale(1)}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:var(--line)}
.dragcard{opacity:.9;box-shadow:0 8px 20px #0004;position:relative;z-index:3}
#ctip{position:fixed;pointer-events:none;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:calc(12px*var(--fz,1));box-shadow:0 2px 8px #0003;display:none;z-index:30;white-space:nowrap}
.phr{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.phr:last-child{border:0}
.huge{font-size:calc(40px*var(--fz,1));font-weight:700;line-height:1.35;text-align:center;padding:24px 4px;word-break:break-word}
@media print{.rimg{width:auto!important;height:auto!important;max-width:100%!important;max-height:12cm!important}.card.row:has(.rimg){display:block}header,nav,.fab,.noprint,.chips{display:none!important}.printonly{display:block!important}body{padding:0;background:#fff;color:#000}.card{break-inside:avoid;border-color:#ccc;background:#fff}.daybar{position:static;background:#fff}a{color:#000}}
</style>

<body>
<div id="offline">離線中：資料照常可用，地圖只顯示看過的區域</div>
<header>
  <select id="tripSel"></select>
  <button id="searchBtn" aria-label="搜尋">🔍</button>
  <button id="setBtn" aria-label="設定">⚙︎</button>
</header>
<main id="view"></main>
<button class="fab pri" id="fab">＋</button>
<nav id="nav"></nav>
<div id="toast"><span></span><button type="button"></button></div>
<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>

<script>
"use strict";
// ===== 儲存 =====
const KEY = "travel_v1";
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const today = () => new Date().toLocaleDateString("sv");

function newTrip(name) {
  return { id: uid(), name: name || "新旅程", start: "", end: "", home: "TWD", cur: "JPY", people: ["我"], budget: 0, manualRate: 0,
    itin: [], spots: [], books: [], tickets: [], exp: [], pack: [], emerg: [], phr: [], loc: null, wallet: [], prep: {}, shop: [], diary: [] };
}
let S;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
if (!S || !S.trips || !S.trips.length) { const t = newTrip("我的旅程"); S = { trips: [t], cur: t.id, tab: "home", rates: null }; }
// 雲端同步: 填入 Firebase 設定後啟用(見 README), null = 只存本機
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDRSrNJZd5C3Nrz_mX8TaY65PKBSmz1Wbw",
  authDomain: "travel-672ff.firebaseapp.com",
  projectId: "travel-672ff",
  storageBucket: "travel-672ff.firebasestorage.app",
  messagingSenderId: "1000112370662",
  appId: "1:1000112370662:web:bcb195ec1513d002e65c27",
};
S.deleted ||= {};
// 每個旅程記最後修改時間 mt, 同步時以 mt 較新者為準
const snap = {};
const tripKey = (t) => JSON.stringify({ ...t, mt: 0 });
const saveLocal = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { alert("儲存失敗：" + e.message); } };
const save = () => {
  for (const t of S.trips) {
    const j = tripKey(t);
    if (snap[t.id] === j) continue;
    if (snap[t.id] !== undefined || !t.mt) t.mt = Date.now();
    snap[t.id] = j;
    pushQ.add(t.id);
  }
  saveLocal();
  clearTimeout(pushTimer); pushTimer = setTimeout(flushPush, 800);
};
const pushQ = new Set(); let pushTimer;
function flushPush() {
  clearTimeout(pushTimer);
  if (!window.TravelSync) return;
  for (const id of pushQ) { const t = S.trips.find((x) => x.id === id); if (t) TravelSync.push(t); }
  pushQ.clear();
}
// 關掉或切到背景前, 把還沒傳的送出去
addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") flushPush();
  else loadRates(); // 切回來時, 超過 6 小時就重抓匯率
});
addEventListener("pagehide", flushPush);
// 舊版建立的旅程缺新功能的欄位(錢包、日記、必買…), 載入時補上預設值
function fillTrip(t) { const base = newTrip(); for (const k of Object.keys(base)) if (t[k] == null) t[k] = base[k]; return t; }
S.trips.forEach(fillTrip);
const T = () => { const t = S.trips.find((x) => x.id === S.cur) || S.trips[0]; return t.diary && t.shop ? t : fillTrip(t); };

// 票券檔案存 IndexedDB(localStorage 只有 ~5MB)
const idb = new Promise((res, rej) => {
  const r = indexedDB.open("travel_files", 1);
  r.onupgradeneeded = () => r.result.createObjectStore("f");
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
});
async function fput(id, blob) { const db = await idb; return new Promise((res, rej) => { const tx = db.transaction("f", "readwrite"); tx.objectStore("f").put(blob, id); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }
async function fget(id) { const db = await idb; return new Promise((res) => { const r = db.transaction("f").objectStore("f").get(id); r.onsuccess = () => res(r.result); r.onerror = () => res(null); }); }
async function fdel(id) { const db = await idb; db.transaction("f", "readwrite").objectStore("f").delete(id); }

// ===== 匯率 =====
const CURS = ["TWD", "JPY", "KRW", "USD", "EUR", "GBP", "CNY", "HKD", "MOP", "THB", "SGD", "MYR", "VND", "PHP", "IDR", "AUD", "NZD", "CAD", "CHF", "CZK", "TRY", "AED"];
async function loadRates(force) {
  if (!force && S.rates && Date.now() - S.rates.ts < 6 * 3600e3) return;
  try {
    const r = await fetch("https://open.er-api.com/v6/latest/USD");
    const j = await r.json();
    if (j.result === "success") { S.rates = { ts: Date.now(), r: j.rates }; save(); render(); }
  } catch (e) { if (force) alert("匯率更新失敗，使用快取"); }
}
// 回傳 1 單位 from = ? to
function rate(from, to) {
  if (from === to) return 1;
  const t = T();
  if (t.manualRate > 0) {
    if (from === t.cur && to === t.home) return t.manualRate;
    if (from === t.home && to === t.cur) return 1 / t.manualRate;
  }
  const R = S.rates && S.rates.r;
  if (!R || !R[from] || !R[to]) return NaN;
  return R[to] / R[from];
}
const toHome = (amt, cur) => { const v = (+amt || 0) * rate(cur, T().home); return isFinite(v) ? v : 0; };
const ago = (ts) => { const m = Math.round((Date.now() - ts) / 6e4); return m < 60 ? `${Math.max(1, m)} 分鐘前` : m < 1440 ? `${Math.round(m / 60)} 小時前` : `${Math.round(m / 1440)} 天前`; };
const NF = {};
const fmt = (n, d = 0) => isFinite(n) ? (NF[d] ||= new Intl.NumberFormat("zh-TW", { maximumFractionDigits: d, minimumFractionDigits: 0 })).format(n) : "—";

// ===== 欄位定義(通用表單) =====
const EXP_CATS = ["餐飲", "交通", "住宿", "門票", "購物", "伴手禮", "通訊", "機票", "其他"];
const SPOT_CATS = ["景點", "美食", "購物", "咖啡", "夜生活", "自然", "博物館", "其他"];
const BOOK_TYPES = ["機票", "住宿", "交通", "租車", "保險", "其他"];
const TK_CATS = ["機票", "住宿", "車票/交通卡", "門票", "餐廳預約", "保險/證件", "其他"];
const BAGS = ["托運", "隨身", "身上"];
const SHOP_CATS = ["伴手禮", "藥妝", "零食", "電器", "衣服鞋包", "其他"];
// 同一天行程的順序: 拖拉過就用 ord, 沒排過照時間
const byOrd = (a, b) => (a.ord ?? 1e9) - (b.ord ?? 1e9) || (a.time || "99").localeCompare(b.time || "99");
// 新增或改時間時, 把它插到已排序的同一天裡「時間對的位置」
function placeByTime(t, it) {
  const day = t.itin.filter((x) => x !== it && x.date === it.date);
  if (!day.some((x) => x.ord != null)) { delete it.ord; return; }
  const arr = day.sort(byOrd);
  // 放在「最後一個時間 ≤ 它」的後面; 都比它晚就放最前面; 沒時間放最後
  let idx = arr.length;
  if (it.time) {
    const before = arr.map((x, i) => (x.time && x.time <= it.time ? i : -1)).filter((i) => i >= 0);
    idx = before.length ? before[before.length - 1] + 1 : arr.findIndex((x) => x.time) >= 0 ? arr.findIndex((x) => x.time) : arr.length;
  }
  arr.splice(idx, 0, it);
  arr.forEach((x, i) => (x.ord = i));
}
// 行程類型(顏色/圖示); 舊行程沒填就依名稱判斷
const ICATS = [["景點", "🏛"], ["住宿", "🏨"], ["美食", "🍜"], ["交通", "🚃"], ["購物", "🛍"], ["其他", "📌"]];
const icatOf = (i) => i.cat || (/住宿|飯店|酒店|旅館|民宿|入住|退房|check.?in|check.?out|hotel|ホテル|旅館|hostel|resort/i.test(`${i.title} ${i.place || ""}`) ? "住宿" : /餐|吃|食|拉麵|壽司|燒肉|咖啡|早午餐|屋台|居酒屋|cafe|restaurant/i.test(i.title) ? "美食" : /機場|車站|搭車|新幹線|巴士|航班|flight|airport|station/i.test(i.title) ? "交通" : "景點");

function openForm(kind, item, after, pre) {
  const t = T(), isNew = !item, o = item ? { ...item } : { ...DEFAULTS[kind](), ...pre };
  const hint = o._hint; delete o._hint;
  if (kind === "itin" && !o.cat) o.cat = icatOf(o);
  const f = $("#dlgForm");
  let h = `<h3>${isNew ? "新增" : "編輯"}</h3>${hint ? `<div class="mut">${esc(hint)}</div>` : ""}`;
  for (const [k, lab, type, req, opts] of SCHEMA[kind]) {
    const v = o[k] ?? "";
    h += type === "check" ? "" : `<label>${lab}</label>`;
    if (type === "select") h += `<select name="${k}">${opts.map((x) => `<option ${x === v ? "selected" : ""}>${x}</option>`).join("")}</select>`;
    else if (type === "cur") h += `<select name="${k}">${[...new Set([t.cur, t.home, ...CURS])].map((x) => `<option ${x === v ? "selected" : ""}>${x}</option>`).join("")}</select>`;
    else if (type === "payer") h += `<select name="${k}">${t.people.map((x) => `<option ${x === v ? "selected" : ""}>${esc(x)}</option>`).join("")}</select>`;
    else if (type === "split") h += `<div class="row">${t.people.map((p) => `<label style="margin:0"><input type="checkbox" style="width:auto" name="split" value="${esc(p)}" ${(v || []).includes(p) ? "checked" : ""}> ${esc(p)}</label>`).join("")}</div>`;
    else if (type === "textarea") h += `<textarea name="${k}">${esc(v)}</textarea>`;
    else if (type === "check") h += `<label><input type="checkbox" style="width:auto" name="${k}" ${v ? "checked" : ""}> ${lab}</label>`;
    else if (type === "file") h += `${o.fileName ? `<div class="mut">目前：${esc(o.fileName)}</div>` : ""}<input type="file" name="file" accept="image/*,application/pdf">`;
    else h += `<input name="${k}" type="${type}" ${type === "number" ? 'step="any" inputmode="decimal"' : ""} value="${esc(v)}" ${req ? "required" : ""}>`;
  }
  h += `<div class="row" style="margin-top:14px">${isNew ? "" : '<button value="del" class="del" formnovalidate>刪除</button>'}<span class="sp"></span><button value="cancel" formnovalidate>取消</button><button value="ok" class="pri">儲存</button></div>`;
  f.innerHTML = h;
  // 新增時直接跳到最重要的欄位(記帳=金額)
  if (isNew) setTimeout(() => { const el = f.elements[kind === "exp" ? "amt" : (SCHEMA[kind].find((x) => x[3]) || [])[0]]; if (el && !el.value) el.focus(); }, 50);
  const dlg = $("#dlg");
  dlg.onclose = async () => {
    const act = dlg.returnValue; dlg.returnValue = "";
    if (act === "del") {
      // 先移除, 6 秒內可以復原; 沒復原才真的刪檔案
      const idx = t[kind].findIndex((x) => x.id === o.id), gone = t[kind][idx];
      t[kind].splice(idx, 1); save(); render();
      toast(`已刪除「${gone.title || gone.name || gone.note || gone.text || gone.cat || "項目"}」`, "復原", () => { t[kind].splice(Math.min(idx, t[kind].length), 0, gone); save(); render(); },
        () => { if (gone.fileId) { fdel(gone.fileId); window.TravelSync && TravelSync.delFile(t, gone.fileId); } });
      return;
    }
    if (act !== "ok") { if (isNew && o.fileId) { fdel(o.fileId); window.TravelSync && TravelSync.delFile(t, o.fileId); } return; }
    const fd = new FormData(f);
    for (const [k, , type] of SCHEMA[kind]) {
      if (type === "split") o.split = fd.getAll("split");
      else if (type === "check") o[k] = fd.has(k);
      else if (type === "number") o[k] = parseFloat(fd.get(k)) || 0;
      else if (type === "file") {
        const file = fd.get("file");
        if (file && file.size) {
          if (o.fileId) { await fdel(o.fileId); window.TravelSync && TravelSync.delFile(t, o.fileId); }
          Object.assign(o, await storeFile(t, file));
        }
      } else o[k] = (fd.get(k) || "").trim();
    }
    const hadDT = item ? item.date + item.time : "";
    // 地點改了就重新定位
    if (item && ((kind === "itin" && item.place !== o.place) || (kind === "spots" && (item.addr !== o.addr || item.name !== o.name)) || (kind === "books" && (item.from !== o.from || item.title !== o.title)))) { o.lat = o.lon = null; o.geoFail = false; }
    if (isNew) { o.id = uid(); t[kind].push(o); } else Object.assign(item, o);
    if (kind === "itin") { const it = isNew ? o : item; if (isNew || hadDT !== it.date + it.time) placeByTime(t, it); }
    save(); render(); after && after(o);
  };
  dlg.showModal();
}

// ===== 目的地(城市定位) =====
const CUR2CC = { JPY: "JP", KRW: "KR", THB: "TH", SGD: "SG", CNY: "CN", AUD: "AU", NZD: "NZ", EUR: "FR", GBP: "GB", USD: "US", CAD: "CA", HKD: "HK", MOP: "MO", VND: "VN", MYR: "MY", PHP: "PH", IDR: "ID", CHF: "CH", CZK: "CZ", TRY: "TR", AED: "AE", TWD: "TW" };
const ccOf = (t) => (t.loc && t.loc.cc) || CUR2CC[t.cur] || "";
async function geoCity(q, cur) {
  const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?count=10&language=zh&format=json&name=${encodeURIComponent(q)}`);
  const rs = (await r.json()).results || [], want = CUR2CC[cur];
  // 同名城市很多(例如「福岡」), 優先選跟旅程幣別同一國的
  const x = (want && rs.find((y) => y.country_code === want)) || rs[0];
  return x ? { name: x.name, country: x.country || "", lat: +x.latitude.toFixed(4), lon: +x.longitude.toFixed(4), tz: x.timezone, cc: x.country_code } : null;
}

// ===== 天氣(Open-Meteo, 免金鑰, 16天預報) =====
const WXI = { 0: "☀️", 1: "🌤", 2: "⛅", 3: "☁️", 45: "🌫", 48: "🌫", 51: "🌦", 53: "🌦", 55: "🌦", 56: "🌧", 57: "🌧", 61: "🌧", 63: "🌧", 65: "🌧", 66: "🌧", 67: "🌧", 71: "🌨", 73: "🌨", 75: "❄️", 77: "🌨", 80: "🌦", 81: "🌧", 82: "⛈", 85: "🌨", 86: "❄️", 95: "⛈", 96: "⛈", 99: "⛈" };
S.wx ||= {};
const wxBusy = {};
const wxKey = (t) => t.loc && t.loc.lat + "," + t.loc.lon;
function loadWx(t) {
  const k = wxKey(t);
  if (!k || wxBusy[k] || (S.wx[k] && Date.now() - S.wx[k].ts < 3 * 3600e3)) return;
  wxBusy[k] = 1;
  fetch(`https://api.open-meteo.com/v1/forecast?latitude=${t.loc.lat}&longitude=${t.loc.lon}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=16`)
    .then((r) => r.json()).then((j) => {
      const d = {};
      j.daily.time.forEach((x, i) => (d[x] = [j.daily.weather_code[i], Math.round(j.daily.temperature_2m_max[i]), Math.round(j.daily.temperature_2m_min[i]), j.daily.precipitation_probability_max[i]]));
      S.wx[k] = { ts: Date.now(), d }; saveLocal(); if (!$("#dlg").open) render();
    }).catch(() => {}).finally(() => delete wxBusy[k]);
}
const wxOf = (t, date) => { const c = S.wx[wxKey(t)]; return c && c.d[date]; };
const wxTxt = (w) => w ? `${WXI[w[0]] || "🌡"} ${w[2]}~${w[1]}°${w[3] != null ? ` ☔${w[3]}%` : ""}` : "";

// ===== 時差時鐘 =====
function tzOff(tz) {
  try {
    const v = new Intl.DateTimeFormat("en-US", { timeZone: tz, timeZoneName: "shortOffset" }).formatToParts(new Date()).find((p) => p.type === "timeZoneName").value;
    const m = v.match(/GMT([+-])(\d+)(?::(\d+))?/);
    return m ? (m[1] === "-" ? -1 : 1) * (+m[2] + (+m[3] || 0) / 60) : 0;
  } catch (e) { return 0; }
}
const clk = (tz) => new Date().toLocaleTimeString("zh-TW", { timeZone: tz, hour: "2-digit", minute: "2-digit", hour12: false });
function clockHtml(t) {
  if (!t.loc) return `<div class="mut">到 ⚙︎ 設定目的地城市，就會顯示當地時間和天氣</div>`;
  const d = tzOff(t.loc.tz) - tzOff("Asia/Taipei");
  return `<div class="row"><div class="sp"><div class="mut">${esc(t.loc.name)} 當地</div><div class="big">${clk(t.loc.tz)}</div></div>
    <div class="sp"><div class="mut">台灣</div><div class="big">${clk("Asia/Taipei")}</div></div>
    <div><div class="mut">時差</div><b>${d === 0 ? "相同" : (d > 0 ? "+" : "") + d + " 小時"}</b></div></div>`;
}
setInterval(() => { const el = $("#clock"); if (el && !$("#dlg").open) el.innerHTML = clockHtml(T()); }, 30000);

// ===== 地圖(Leaflet + OpenStreetMap) =====
let leafletP;
function loadLeaflet() {
  return (leafletP ||= new Promise((res, rej) => {
    const l = document.createElement("link"); l.rel = "stylesheet"; l.href = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"; document.head.appendChild(l);
    const sc = document.createElement("script"); sc.src = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js";
    sc.onload = () => res(window.L); sc.onerror = () => { leafletP = null; rej(); }; document.head.appendChild(sc);
  }));
}
const isUrl = (s) => /^https?:/.test(s || "");
function coordFromLink(s) {
  const m = (s || "").match(/@(-?\d+\.\d+),(-?\d+\.\d+)/) || (s || "").match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/) || (s || "").match(/[?&](?:q|query|ll|destination)=(-?\d+\.\d+),\s*(-?\d+\.\d+)/);
  return m ? [+m[1], +m[2]] : null;
}
async function geocode(q, t) {
  const cc = ccOf(t) ? `&countrycodes=${ccOf(t).toLowerCase()}` : "";
  const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=zh-TW${cc}&q=${encodeURIComponent(q)}`);
  const j = await r.json();
  return j[0] ? [+j[0].lat, +j[0].lon] : null;
}
const needGeo = (x) => x.lat == null && !x.geoFail;
async function geoAll(t) {
  const list = [...t.itin.map((i) => [i, i.place, i.title]), ...t.spots.map((s) => [s, s.addr, s.name + (s.city ? " " + s.city : "")]), ...bookHotels(t).map((h) => [h, h.from, h.title])].filter(([x]) => needGeo(x));
  if (!list.length) return alert("全部都定位過了");
  const btn = $("#geoBtn"); let n = 0, ok = 0;
  for (const [x, place, name] of list) {
    if (btn) btn.textContent = `定位中 ${++n}/${list.length}…`;
    let c = coordFromLink(place);
    try {
      for (const q of [isUrl(place) ? "" : place, name].filter(Boolean)) {
        if (c) break;
        c = await geocode(q, t);
        await new Promise((r) => setTimeout(r, 1100)); // Nominatim 限每秒1次
      }
    } catch (e) { }
    if (c) { x.lat = c[0]; x.lon = c[1]; ok++; } else x.geoFail = true;
  }
  save(); render();
  alert(`定位完成：${ok}/${list.length}` + (ok < list.length ? "\n找不到的可以編輯地點，改成更完整的地址或貼含座標的 Google 地圖連結" : ""));
}
async function initMap(t) {
  const el = $("#map"); if (!el) return;
  let L; try { L = await loadLeaflet(); } catch (e) { el.innerHTML = '<div class="empty">地圖載入失敗（需要網路）</div>'; return; }
  if (!el.isConnected) return;
  const m = L.map(el);
  // crossOrigin: 讓底圖可以被 Service Worker 正常快取, 看過的區域離線也看得到
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, crossOrigin: "anonymous", attribution: "© OpenStreetMap" }).addTo(m);
  window.__map = m;
  const nav = (x) => `<a target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${x.lat},${x.lon}">導航 ↗</a>`;
  const pts = [], day = filt.md;
  const items = t.itin.filter((i) => i.date === day && i.lat != null).sort(byOrd);
  items.forEach((i, n) => {
    L.marker([i.lat, i.lon], { icon: L.divIcon({ className: "", html: `<div class="pin">${n + 1}</div>`, iconSize: [26, 26], iconAnchor: [13, 13] }) })
      .addTo(m).bindPopup(`<b>${esc(i.time || "")} ${esc(i.title)}</b><br>${nav(i)}`);
    pts.push([i.lat, i.lon]);
  });
  const hs = day === "全部景點" ? hotels(t) : [wakeHotel(t, day), sleepHotel(t, day)].filter((h, i, a) => h && a.indexOf(h) === i);
  hs.filter((h) => h.lat != null).forEach((h) => {
    L.marker([h.lat, h.lon], { icon: L.divIcon({ className: "", html: '<div class="pin" style="background:#7c3aed">🏨</div>', iconSize: [26, 26], iconAnchor: [13, 13] }) })
      .addTo(m).bindPopup(`<b>🏨 ${esc(h.title)}</b><br>${dt(h.start)} ～ ${dt(h.end)}<br>${nav(h)}`);
    pts.push([h.lat, h.lon]);
  });
  if (items.length > 1) L.polyline(pts.slice(0, items.length), { color: "#0f766e", weight: 3, opacity: 0.7, dashArray: "6 6" }).addTo(m);
  t.spots.filter((s) => s.lat != null).forEach((s) => {
    L.circleMarker([s.lat, s.lon], { radius: day === "全部景點" ? 8 : 5, color: s.done ? "#9ca3af" : s.prio === "必去" ? "#dc2626" : "#d97706", fillOpacity: 0.8 })
      .addTo(m).bindPopup(`<b>${esc(s.name)}</b><br>${esc(s.prio)}・${esc(s.cat)}<br>${nav(s)}`);
    if (day === "全部景點") pts.push([s.lat, s.lon]);
  });
  if (pts.length) m.fitBounds(pts, { padding: [30, 30], maxZoom: 15 });
  else if (t.loc) m.setView([t.loc.lat, t.loc.lon], 12);
  else m.setView([25.03, 121.56], 4);
}

// ===== 分享 / 列印 =====
function itinText(t) {
  let s = `${t.name}\n${t.start || ""}～${t.end || ""}\n`;
  const by = {}; t.itin.forEach((i) => (by[i.date || "未定"] ||= []).push(i));
  const startD = t.start ? new Date(t.start + "T00:00") : null;
  for (const d of Object.keys(by).sort()) {
    const n = startD && d !== "未定" ? Math.round((new Date(d + "T00:00") - startD) / 864e5) + 1 : null;
    s += `\n【${n ? `Day ${n} ` : ""}${d}${dayName(d) ? "(" + dayName(d) + ")" : ""}】${wxTxt(wxOf(t, d))}\n`;
    for (const i of by[d].sort(byOrd))
      s += `${i.time || "--:--"} ${i.title}${i.place && !isUrl(i.place) ? "＠" + i.place : ""}\n`;
  }
  return s;
}

// ===== 收據辨識(Tesseract.js, 在手機上跑, 不上傳) =====
let tessP;
const loadTess = () => (tessP ||= new Promise((res, rej) => { const sc = document.createElement("script"); sc.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"; sc.onload = () => res(window.Tesseract); sc.onerror = () => { tessP = null; rej(new Error("載入失敗")); }; document.head.appendChild(sc); }));
async function shrink(file, max = 1600, q = 0.85) {
  const img = await createImageBitmap(file);
  const k = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);

function parseTotal(text) {
  const nums = (l) => (l.replace(/(\d)[,，](?=\d{3}\b)/g, "$1").match(/\d+(?:\.\d{1,2})?/g) || []).map(Number).filter((n) => n > 0 && n < 1e8);
  const SKIP = /お預|預り|釣|CHANGE|Change|change|TENDER|Tender|CASH|Cash|거스름|받은|ทอน|รับเงิน|Rückgeld|Gegeben/;
  const STRONG = /合\s*計|合计|総\s*計|お会計|TOTAL|Total|total|합\s*계|총\s*액|결제금액|รวมทั้งสิ้น|ยอดรวม|ยอดสุทธิ|Summe|SUMME|Gesamt|Totale|TOTALE|Tổng/;
  const WEAK = /計|Amount|AMOUNT|결제|รวม|Betrag/;
  const lines = text.split(/\n/).filter((l) => !SKIP.test(l));
  for (const re of [STRONG, WEAK]) {
    const v = lines.filter((l) => re.test(l)).flatMap(nums);
    if (v.length) return Math.max(...v);
  }
  return 0;
}

function lineChart(pts, dec = 4) {

  g += `<line class="gx" x1="0" x2="0" y1="${pt}" y2="${pt + ph}" style="stroke:var(--mut);stroke-width:1;display:none"/>`;

function parseCSV(text) {
  const rows = [], row = [""]; let q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { row[row.length - 1] += '"'; i++; } else q = false; } else row[row.length - 1] += c; }
    else if (c === '"') q = true;
    else if (c === ",") row.push("");
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; rows.push(row.splice(0)); row.push(""); }
    else row[row.length - 1] += c;
  }
  if (row.length > 1 || row[0]) rows.push(row);
  return rows.filter((r) => r.some((x) => x.trim()));
}
const nameFromUrl = (u) => { const m = (u || "").match(/\/place\/([^/@?]+)/); return m ? decodeURIComponent(m[1].replace(/\+/g, " ")) : ""; };
function parseImport(text, fileName) {
  const out = [];
  const t = text.replace(/^﻿/, "").trim();
  if (/^[\[{]/.test(t)) { // Google Takeout「已加星號的地點」GeoJSON
    const j = JSON.parse(t);
    for (const f of j.features || []) {
      const p = f.properties || {}, loc = p.location || p.Location || {}, g = (f.geometry || {}).coordinates || [];
      const name = p.Title || loc.name || loc["Business Name"] || p.name || nameFromUrl(p.google_maps_url || p["Google Maps URL"]);
      if (!name) continue;
      const o = { name, addr: loc.address || loc.Address || p.google_maps_url || p["Google Maps URL"] || "", note: p.Comment || p.comment || "" };
      if (g.length === 2 && (g[0] || g[1])) { o.lon = +g[0]; o.lat = +g[1]; }
      out.push(o);
    }
    return out;
  }
  const rows = /\.csv$/i.test(fileName || "") || /^Title,/i.test(t) ? parseCSV(t) : null;
  if (rows) { // Google Takeout 已儲存清單 CSV: Title,Note,URL,...
    const h = rows[0].map((x) => x.trim().toLowerCase()), ti = h.indexOf("title"), ui = h.indexOf("url"), ni = h.indexOf("note"), ci = h.indexOf("comment");
    for (const r of rows.slice(1)) {
      const url = ui >= 0 ? r[ui] : "", name = (ti >= 0 && r[ti]) || nameFromUrl(url);
      if (!name) continue;
      const o = { name: name.trim(), addr: (url || "").trim(), note: [ni >= 0 ? r[ni] : "", ci >= 0 ? r[ci] : ""].filter(Boolean).join(" ").trim() };
      const c = coordFromLink(url); if (c) { o.lat = c[0]; o.lon = c[1]; }
      out.push(o);
    }
    return out;
  }
  for (const line of t.split(/\n/).map((l) => l.trim()).filter(Boolean)) { // 一行一個: 地圖連結或地名
    const o = isUrl(line) ? { name: nameFromUrl(line) || "地點", addr: line } : { name: line };
    const c = coordFromLink(line); if (c) { o.lat = c[0]; o.lon = c[1]; }
    out.push(o);
  }
  return out;
}

// ===== 營業時間提醒 =====
const WD_ZH = { 日: 0, 天: 0, 一: 1, 二: 2, 三: 3, 四: 4, 五: 5, 六: 6 }, WD_JA = { 日: 0, 月: 1, 火: 2, 水: 3, 木: 4, 金: 5, 土: 6 }, WD_EN = { sun: 0, mon: 1, tue: 2, wed: 3, thu: 4, fri: 5, sat: 6 };
function weekdaysIn(w) {
  const out = [];
  for (const m of w.matchAll(/(?:週|周|星期|禮拜)([一二三四五六日天])/g)) out.push(WD_ZH[m[1]]);
  for (const m of w.matchAll(/([月火水木金土日])曜/g)) out.push(WD_JA[m[1]]);
  for (const m of w.matchAll(/\b(sun|mon|tue|wed|thu|fri|sat)[a-z]*/gi)) out.push(WD_EN[m[1].toLowerCase()]);
  return out;
}
// "10:00-18:00 週一公休" / "11:00〜22:00（定休日：水曜）" / "Mon closed" → {open, close(分鐘), closed:Set(星期)}
function parseHours(s) {
  if (!s) return null;
  const r = { closed: new Set() };
  const m = s.match(/(\d{1,2})[:：](\d{2})\s*[-~〜～–—至到]\s*(\d{1,2})[:：](\d{2})/);
  if (m) { r.open = +m[1] * 60 + +m[2]; r.close = +m[3] * 60 + +m[4]; if (r.close <= r.open) r.close += 1440; }
  if (/24\s*(小時|時間|h|hours)/i.test(s)) { r.open = 0; r.close = 1440; }
  for (const mm of s.matchAll(/公休|定休日?|休館日?|店休|休業|休み|closed|休/gi)) weekdaysIn(s.slice(Math.max(0, mm.index - 12), mm.index + mm[0].length + 10)).forEach((d) => r.closed.add(d));
  return r.open != null || r.closed.size ? r : null;
}
const hm = (n) => `${String(Math.floor(n / 60) % 24).padStart(2, "0")}:${String(n % 60).padStart(2, "0")}`;
function hoursWarn(i, t) {
  const sp = (i.spotId && t.spots.find((s) => s.id === i.spotId)) || t.spots.find((s) => s.name === i.title);
  const h = parseHours(i.hours || (sp && sp.hours));
  if (!h || !i.date) return "";
  const wd = new Date(i.date + "T00:00").getDay();
  if (h.closed.has(wd)) return `⚠️ 星期${"日一二三四五六"[wd]}公休`;
  if (i.time && h.open != null && h.close - h.open < 1440) {
    const tm = +i.time.slice(0, 2) * 60 + +i.time.slice(3, 5);
    if (h.close > 1440 && tm < h.open && tm >= h.close - 1440) return `⚠️ ${hm(h.close)} 已打烊`; // 跨夜營業, 清晨已關
    const tt = tm < h.open && tm + 1440 < h.close ? tm + 1440 : tm;
    if (tt < h.open) return `⚠️ ${hm(h.open)} 才開`;
    if (tt >= h.close) return `⚠️ ${hm(h.close)} 已打烊`;
    if (tt >= h.close - 45) return `⚠️ 快打烊（${hm(h.close)}）`;
  }
  return "";
}

// ===== 分帳 =====
function settleCalc(t) {
  const paid = Object.fromEntries(t.people.map((p) => [p, 0])), owe = { ...paid };
  for (const e of t.exp) {
    const v = toHome(e.amt, e.cur), sp = (e.split && e.split.length ? e.split : t.people).filter((p) => p in owe);
    if (!sp.length || !isFinite(v)) continue;
    if (e.payer in paid) paid[e.payer] += v;
    sp.forEach((p) => (owe[p] += v / sp.length));
  }
  const bal = t.people.map((p) => [p, paid[p] - owe[p]]);
  const pos = bal.filter(([, v]) => v > 0.5).sort((a, b) => b[1] - a[1]).map((x) => [...x]);
  const neg = bal.filter(([, v]) => v < -0.5).sort((a, b) => a[1] - b[1]).map((x) => [...x]);
  const tr = []; let i = 0, j = 0;
  while (i < pos.length && j < neg.length) {
    const m = Math.min(pos[i][1], -neg[j][1]);
    tr.push([neg[j][0], pos[i][0], m]);
    pos[i][1] -= m; neg[j][1] += m;
    if (pos[i][1] < 0.5) i++; if (neg[j][1] > -0.5) j++;
  }
  return { paid, owe, tr };
}
function settleText(t) {
  const { paid, owe, tr } = settleCalc(t), H = t.home;
  return [`💰 ${t.name} 分帳`, "", ...t.people.map((p) => `${p}：付了 ${fmt(paid[p])}，應付 ${fmt(owe[p])}`), "",
    tr.length ? "👉 轉帳：" : "✅ 已結清", ...tr.map(([a, b, m]) => `${a} → ${b}：${fmt(m)} ${H}`)].join("\n");
}

function calLayout(evs) {

    const cols = [];
    for (const ev of group) { let c = cols.findIndex((end) => end <= ev.s); if (c < 0) { c = cols.length; cols.push(0); } cols[c] = ev.e; ev.col = c; }
    group.forEach((ev) => (ev.cols = cols.length)); out.push(...group); group = [];
  };
  for (const ev of evs) { if (group.length && ev.s >= gEnd) { flush(); gEnd = -1; } group.push(ev); gEnd = Math.max(gEnd, ev.e); }
  if (group.length) flush();
  return out;
}

// 行事曆拖移: 滑鼠直接拖; 手指長按 0.35 秒再拖(不影響一般捲動). 拖本體=改時間, 拖底部=改結束時間, 15 分鐘一格
const calDrag = { on: false, until: 0 };
document.addEventListener("pointerdown", (e) => {
  const el = e.target.closest && e.target.closest("[data-cdrag]"); if (!el || e.button > 0) return;
  const cal = el.closest(".cal"), lo = +cal.dataset.lo;
  const st = { el, id: el.dataset.cdrag, resize: !!e.target.closest("[data-crs]"), y0: e.clientY, top0: parseFloat(el.style.top), h0: parseFloat(el.style.height) + 3, lo, maxY: parseFloat(cal.style.height), active: false, pid: e.pointerId };
  const SNAP = HPX / 4;
  const activate = () => { st.active = calDrag.on = true; el.classList.add("caldrag"); navigator.vibrate && navigator.vibrate(15); };
  if (e.pointerType === "mouse") st.armed = true; else st.timer = setTimeout(() => { st.armed = true; activate(); }, 350);
  const move = (ev) => {
    if (ev.pointerId !== st.pid) return;
    const dy = ev.clientY - st.y0;
    if (!st.active) {
      if (st.armed && Math.abs(dy) > 4) activate();
      else if (!st.armed && Math.abs(dy) > 8) return end(); // 手指先移動 = 捲動頁面, 不拖
      if (!st.active) return;
    }
    if (ev.clientY < 90) scrollBy(0, -10); else if (ev.clientY > innerHeight - 100) scrollBy(0, 10);
    const ddy = ev.clientY - st.y0;
    if (st.resize) { el.style.height = Math.max(SNAP, Math.round((st.h0 + ddy) / SNAP) * SNAP) - 3 + "px"; }
    else { el.style.top = Math.min(st.maxY - SNAP, Math.max(0, Math.round((st.top0 + ddy) / SNAP) * SNAP)) + "px"; }
    const sMin = st.lo * 60 + Math.round((parseFloat(el.style.top) / HPX) * 60), eMin = sMin + Math.round(((parseFloat(el.style.height) + 3) / HPX) * 60);
    const lbl = el.querySelector(".calt"); if (lbl) lbl.textContent = `${hm(sMin)}–${hm(eMin)}`;

  },
  tickets(t) {
    const list = t.tickets.filter((k) => !filt.tc || filt.tc === "全部" || k.cat === filt.tc).sort((a, b) => !!a.used - !!b.used || (a.date || "z").localeCompare(b.date || "z"));

  },
  exp(t) {
    const tot = (arr) => arr.reduce((s, e) => s + toHome(e.amt, e.cur), 0);
    const total = tot(t.exp);
    const byCat = {}; t.exp.forEach((e) => (byCat[e.cat] = (byCat[e.cat] || 0) + toHome(e.amt, e.cur)));
    const maxC = Math.max(1, ...Object.values(byCat));
    const sub = filt.ex || "記帳";

      ${t.people.length > 1 ? `<div class="mut">每人平均 ${fmt(total / t.people.length)}</div>` : ""}</div>`;
    h += walletHtml(t);
    const daily = dailyBudget(t), dsum = (d) => tot(t.exp.filter((e) => e.date === d));
    if (daily) { const td = dsum(today()); h += `<div class="card"><div class="row"><span class="sp">今天花費 <b style="${td > daily ? "color:var(--red)" : ""}">${fmt(td)}</b> / 每日預算 ${fmt(daily)} ${t.home}</span>${td > daily ? '<span class="tag" style="background:var(--red);color:#fff">超支</span>' : ""}</div><div class="bar"><i style="width:${Math.min(100, (td / daily) * 100)}%;${td > daily ? "background:var(--red)" : ""}"></i></div></div>`; }
    const cdays = tripDays(t).length ? tripDays(t) : [...new Set(t.exp.map((e) => e.date).filter(Boolean))].sort();
    if (t.exp.length && cdays.length > 1) h += `<h2>每日花費（${t.home}）</h2><div class="card">${barChart(cdays.map((d) => { const v = dsum(d); return { k: d.slice(5), v, warn: daily && v > daily, tip: `${d}(${dayName(d)})：${fmt(v)} ${t.home}${daily && v > daily ? "・超過每日預算" : ""}` }; }), daily, "每日預算")}</div>`;
    if (Object.keys(byCat).length) h += `<h2>分類（${t.home}）</h2><div class="card"><table>${Object.entries(byCat).sort((a, b) => b[1] - a[1]).map(([c, v]) => `<tr><td style="width:70px">${c}</td><td><div class="bar"><i style="width:${(v / maxC) * 100}%"></i></div></td><td class="r" style="width:90px">${fmt(v)}</td><td class="r mut" style="width:44px">${fmt((v / total) * 100)}%</td></tr>`).join("")}</table></div>`;
    if (t.people.length > 1 && t.exp.length) h += settle(t);
    // 只先顯示最近 80 筆, 其餘按「顯示全部」
    const LIMIT = 80, sorted = t.exp.slice().sort((a, b) => (b.date || "").localeCompare(a.date || ""));
    const shown = filt.expAll ? sorted : sorted.slice(0, LIMIT);
    const by = {}; shown.forEach((e) => (by[e.date || "未定"] ||= []).push(e));
    const dayTot = {}; t.exp.forEach((e) => { const k = e.date || "未定"; dayTot[k] = (dayTot[k] || 0) + toHome(e.amt, e.cur); });
    h += Object.keys(by).sort().reverse().map((d) => `<div class="daybar row"><span class="sp">${d} ${dayName(d) ? "(" + dayName(d) + ")" : ""}</span><span class="mut" style="${daily && dayTot[d] > daily ? "color:var(--red);font-weight:700" : ""}">${fmt(dayTot[d])} ${t.home}${daily && dayTot[d] > daily ? " 超支" : ""}</span></div>` +
      by[d].map((e) => `<div class="card row" data-edit="exp:${e.id}"><div class="sp"><b>${esc(e.note || e.cat)}</b>${e.fileId ? ` <button class="sm" data-act="fopen" data-k="exp" data-id="${e.id}">🧾</button>` : ""}<div class="mut">${esc(e.cat)}・${esc(e.pay || "")}${t.people.length > 1 ? `・${esc(e.payer)}付` : ""}</div></div>
        <div style="text-align:right"><b>${fmt(e.amt, 2)} ${e.cur}</b>${e.cur !== t.home ? `<div class="mut">≈ ${fmt(toHome(e.amt, e.cur))} ${t.home}</div>` : ""}</div></div>`).join("")).join("");
    if (sorted.length > shown.length) h += `<div style="text-align:center;margin:10px 0"><button data-act="expall">顯示全部 ${sorted.length} 筆</button></div>`;
    return h + (t.exp.length ? "" : `<div class="empty">還沒有花費</div>`);
  },
  fx(t) {
    const sub = filt.tool || "匯率";
    const head = `<div class="chips">${["匯率", "退稅", "小費", "外語", "緊急"].map((x) => `<button class="${x === sub ? "on" : ""}" data-f="tool" data-v="${x}">${x}</button>`).join("")}</div>`;

    const ts = S.rates ? new Date(S.rates.ts).toLocaleString("zh-TW") : "未取得";
    const quick = [100, 500, 1000, 2000, 5000, 10000].map((x) => (t.cur === "JPY" || t.cur === "KRW" || t.cur === "VND" || t.cur === "IDR") ? x * 10 : x / 10);

      <input id="fxC" type="number" inputmode="decimal" step="any" value="1" style="margin-top:8px"><div class="big" id="fxCo" style="margin-top:6px"></div></div>` + fxHistHtml(t);
  },
  pack(t) {
    const sub = filt.pk || "必買";
    const head = `<div class="chips">${["必買", "行李", "出發準備"].map((x) => `<button class="${x === sub ? "on" : ""}" data-f="pk" data-v="${x}">${{ 必買: "🛍", 行李: "🧳", 出發準備: "✈️" }[x]} ${x}</button>`).join("")}</div>`;
    if (sub === "必買") return head + shopHtml(t);

};

  外語(t) {

    return `<div class="chips">${LANGS.map(([n]) => `<button class="${n === L ? "on" : ""}" data-f="lang" data-v="${n}">${n}</button>`).join("")}</div>
      <div class="mut" style="margin-bottom:6px">點句子會放大給對方看，🔊 可以唸出來</div>
      ${t.phr.length ? `<h2>我的句子</h2><div class="card">${t.phr.map((p) => `<div class="phr"><div class="sp" data-big="${esc(p.text)}" data-zh="${esc(p.zh)}" data-lang=""><b>${esc(p.text)}</b><div class="mut">${esc(p.zh)}</div></div><button class="sm" data-edit="phr:${p.id}">✎</button></div>`).join("")}</div>` : ""}
      <h2>常用句</h2><div class="card">${PHRASES.map((p) => `<div class="phr"><div class="sp" data-big="${esc(p[col])}" data-zh="${esc(p[0])}" data-lang="${code}"><b>${esc(p[col])}</b><div class="mut">${esc(p[0])}</div></div><button class="sm" data-say="${esc(p[col])}" data-lang="${code}">🔊</button></div>`).join("")}</div>
      <div class="mut">按 ＋ 可以新增自己的句子（例如飯店地址、過敏食物）</div>`;
  },
  緊急(t) {
    const cc = ccOf(t), list = SOS[cc] || [["緊急（多數國家通用）", "112"]];
    return `<h2>${esc((TAX[cc] || [""])[0] || t.loc?.country || "當地")} 緊急電話</h2><div class="card"><table>${list.map(([n, tel]) => `<tr><td>${esc(n)}</td><td class="r big" style="font-size:calc(20px*var(--fz,1))">${telLink(tel)}</td></tr>`).join("")}</table></div>
      <h2>台灣外交部</h2><div class="card"><table><tr><td>外交部緊急聯絡中心（24小時）</td><td class="r">${telLink("+886-800-085-095")}</td></tr></table>
      <div class="mut">當地駐外館處電話請到 <a href="https://www.boca.gov.tw/" target="_blank" rel="noopener">外交部領事事務局</a> 查詢後按 ＋ 存下來</div></div>
      <h2>我的緊急聯絡</h2>${t.emerg.length ? `<div class="card"><table>${t.emerg.map((x) => `<tr data-edit="emerg:${x.id}"><td><b>${esc(x.name)}</b>${x.note ? `<div class="mut" style="white-space:pre-wrap">${esc(x.note)}</div>` : ""}</td><td class="r">${x.tel ? telLink(x.tel) : ""}</td></tr>`).join("")}</table></div>` : `<div class="card mut">按 ＋ 新增：旅平險／海外急難救助電話、信用卡掛失電話、飯店電話、駐外館處…</div>`}`;

function toolBind(t) {
  const sub = filt.tool || "匯率";
  if (sub === "匯率") return fxBind(t);
  if (sub === "退稅") {
    $("#taxCc").onchange = (e) => { filt.taxcc = e.target.value; render(); };
    const p = $("#taxP"); if (!p) return;
    const calc = () => {
      const price = +p.value || 0, vat = +$("#taxV").value || 0, fee = +$("#taxF").value || 0, min = +$("#taxM").value || 0;
      const back = (price * vat) / (100 + vat) * (1 - fee / 100);
      $("#taxO").textContent = price ? `可退約 ${fmt(back, 2)} ${t.cur}` : "—";
      $("#taxO2").innerHTML = price ? `≈ ${fmt(toHome(back, t.cur))} ${t.home}・約售價 ${fmt((back / price) * 100, 1)}%${price < min ? `<br><b style="color:var(--red)">未達門檻 ${fmt(min)}，還差 ${fmt(min - price, 2)}</b>` : ""}` : "";
    };
    ["#taxP", "#taxV", "#taxF", "#taxM"].forEach((s) => ($(s).oninput = calc));
  }
  if (sub === "小費") {
    const calc = () => {
      const b = +$("#tipB").value || 0, pc = +$("#tipP").value || 0, n = Math.max(1, +$("#tipN").value || 1);
      const tip = (b * pc) / 100, tot = b + tip;
      $("#tipO").innerHTML = b ? `<table><tr><td>小費</td><td class="r"><b>${fmt(tip, 2)}</b> ${t.cur}</td></tr><tr><td>總額</td><td class="r"><b>${fmt(tot, 2)}</b> ${t.cur}</td></tr>
        <tr><td>每人（${n}人）</td><td class="r"><b>${fmt(tot / n, 2)}</b> ${t.cur}<div class="mut">≈ ${fmt(toHome(tot / n, t.cur))} ${t.home}</div></td></tr></table>` : "";
    };
    ["#tipB", "#tipP", "#tipN"].forEach((s) => ($(s).oninput = calc));
    document.querySelectorAll("[data-tip]").forEach((b) => (b.onclick = () => { $("#tipP").value = b.dataset.tip; calc(); }));
  }
}
const fabKind = () => S.tab === "itin" && filt.iv === "日記" ? null : S.tab === "fx" ? { 外語: "phr", 緊急: "emerg" }[filt.tool] : S.tab === "pack" ? { 必買: "shop", 行李: "pack" }[filt.pk || "必買"] : SCHEMA[S.tab] ? S.tab : null;

function shopHtml(t) {

  const byCat = {}; t.shop.forEach((x) => (byCat[x.cat] ||= []).push(x));
  const img = (x, cls) => x.fileId && !/pdf/.test(x.fileType || "") ? `<img class="${cls}" data-fid="${x.fileId}" data-act="shopimg" data-id="${x.id}" alt="${esc(x.name)}">` : `<div class="${cls} noimg" data-edit="shop:${x.id}">🛍</div>`;

    Object.entries(byCat).map(([c, arr]) => `<h2>${esc(c)} <span class="mut" style="font-weight:400">${arr.filter((x) => x.ok).length}/${arr.length}</span></h2>` + (grid
      ? `<div class="shopgrid">${arr.sort((a, b) => !!a.ok - !!b.ok).map((x) => `<div class="stile ${x.ok ? "done" : ""}">

          <div class="sbody" data-edit="shop:${x.id}"><b>${esc(x.name)}${+x.qty > 1 ? ` ×${x.qty}` : ""}</b><div style="font-size:calc(13px*var(--fz,1))">${price(x)}</div><div class="mut" style="font-size:calc(12px*var(--fz,1))">${meta(x)}</div></div>
          ${x.ok ? "" : `<button class="sm pri" data-act="shopbuy" data-id="${x.id}" style="margin:0 8px 8px">🛒 買了，記帳</button>`}</div>`).join("")}</div>`
      : arr.sort((a, b) => !!a.ok - !!b.ok).map((x) => `<div class="card row ${x.ok ? "done" : ""}" style="align-items:flex-start" data-edit="shop:${x.id}">
          ${img(x, "sthumb")}
          <div class="sp"><div class="row"><input type="checkbox" style="width:auto" data-act="shoptog" data-id="${x.id}" ${x.ok ? "checked" : ""}><h3 class="sp" style="margin:0">${esc(x.name)}${+x.qty > 1 ? ` ×${x.qty}` : ""}</h3></div>
          <div>${price(x)}</div><div class="mut">${meta(x)}</div>${x.note ? `<div class="mut" style="white-space:pre-wrap">${esc(x.note)}</div>` : ""}

function render() {
  const t = T();
  $("#tripSel").innerHTML = S.trips.map((x) => `<option value="${x.id}" ${x.id === t.id ? "selected" : ""}>${esc(x.name)}</option>`).join("") + `<option value="__new">＋ 新增旅程</option>`;
  $("#nav").innerHTML = TABS.map(([k, ic, n]) => `<button data-tab="${k}" class="${S.tab === k ? "on" : ""}"><b>${ic}</b>${n}</button>`).join("");
  try { $("#view").innerHTML = V[S.tab](t); }
  catch (err) {
    console.error(err);
    $("#view").innerHTML = `<div class="card" style="border-color:var(--red)"><b>這頁出錯了</b><div class="mut" style="margin-top:4px">請截圖給開發者：${esc(err.message)}</div><div class="mut">${esc((err.stack || "").split("\n")[1] || "")}</div></div>`;
  }
  $("#fab").style.display = fabKind() ? "" : "none";
  if (S.tab === "fx") toolBind(t);
  if (S.tab === "itin" && filt.iv === "地圖") initMap(t);
  if ((S.tab === "exp" && filt.ex === "收據整理") || (S.tab === "itin" && filt.iv === "日記") || (S.tab === "pack" && (filt.pk || "必買") === "必買")) fillThumbs();
  if (S.tab === "itin" && (filt.iv || "行事曆") === "行事曆") calScroll();
  if ($("#ocrIn")) $("#ocrIn").onchange = (e) => { const f = e.target.files[0]; if (f) doOcr(f).catch((err) => alert("失敗：" + err.message)); };
  loadWx(t);
}

function fxBind(t) {
  const a = $("#fxA"), b = $("#fxB");
  let from = t.cur, to = t.home;
  a.oninput = () => (b.value = a.value ? +(a.value * rate(from, to)).toFixed(2) : "");
  b.oninput = () => (a.value = b.value ? +(b.value * rate(to, from)).toFixed(2) : "");
  $("#fxSwap").onclick = (e) => { e.preventDefault(); const la = a.previousElementSibling, lb = b.previousElementSibling; [la.textContent, lb.textContent] = [lb.textContent, la.textContent]; [from, to] = [to, from]; a.oninput(); };
  const c = () => ($("#fxCo").textContent = fmt(($("#fxC").value || 0) * rate($("#fxC1").value, $("#fxC2").value), 4) + " " + $("#fxC2").value);
  $("#fxC").oninput = $("#fxC1").onchange = $("#fxC2").onchange = c; c();
}

// 行程拖拉排序(手指/滑鼠都可): 按住 ⠿ 上下拖
document.addEventListener("pointerdown", (e) => {
  const h = e.target.closest("[data-drag]"); if (!h) return;
  e.preventDefault();
  const card = h.closest("[data-iid]"), box = card.parentElement;
  let moved = false;
  box.classList.add("dragging"); card.classList.add("dragcard");
  const move = (ev) => {
    moved = true;
    const cards = [...box.querySelectorAll("[data-iid]")].filter((c) => c !== card);
    const after = cards.find((c) => { const r = c.getBoundingClientRect(); return ev.clientY < r.top + r.height / 2; });
    box.insertBefore(card, after || null);
    card.style.transform = "";
    if (ev.clientY < 80) scrollBy(0, -12); else if (ev.clientY > innerHeight - 90) scrollBy(0, 12);
  };
  const up = () => {
    removeEventListener("pointermove", move); removeEventListener("pointerup", up); removeEventListener("pointercancel", up);
    box.classList.remove("dragging"); card.classList.remove("dragcard");
    if (!moved) return;
    const t = T();
    [...box.querySelectorAll("[data-iid]")].forEach((c, i) => { const it = t.itin.find((x) => x.id === c.dataset.iid); if (it) it.ord = i; });
    save(); render();
  };
  addEventListener("pointermove", move); addEventListener("pointerup", up); addEventListener("pointercancel", up);
});
function goTab(tab, fromHistory) {
  if (!fromHistory && tab !== S.tab) history.pushState({ tab }, "");
  S.tab = tab; saveLocal(); render(); scrollTo(0, 0);
  // 旅途中打開行程, 直接捲到今天
  if (tab === "itin" && filt.iv === "清單") { const d = document.querySelector(`[data-day="${today()}"]`); if (d) d.scrollIntoView({ block: "start" }); }
}
// 手機返回鍵: 有視窗就關視窗, 否則回上一個分頁(不會直接跳出 App)

let ignorePop = false, closingByBack = false;
new MutationObserver(() => {
  const dlg = $("#dlg"), st = history.state || {};
  if (dlg.open && !st.dlg) history.pushState({ dlg: 1, tab: S.tab }, "");
  else if (!dlg.open && st.dlg && !closingByBack) { ignorePop = true; history.back(); }
}).observe($("#dlg"), { attributes: true, attributeFilter: ["open"] });
addEventListener("popstate", (e) => {
  if (ignorePop) { ignorePop = false; return; }
  const dlg = $("#dlg");
  if (dlg.open) { closingByBack = true; dlg.close("cancel"); closingByBack = false; return; }
  if (e.state && e.state.tab && e.state.tab !== S.tab) goTab(e.state.tab, true);
});

let toastTimer, toastDone;
function toast(msg, btn, onBtn, onExpire) {
  const el = $("#toast");
  if (toastDone) { toastDone(); toastDone = null; }
  clearTimeout(toastTimer);
  el.querySelector("span").textContent = msg;
  const b = el.querySelector("button"); b.textContent = btn || ""; b.style.display = btn ? "" : "none";
  b.onclick = () => { toastDone = null; clearTimeout(toastTimer); el.style.display = "none"; onBtn && onBtn(); };
  el.style.display = "flex";
  toastDone = onExpire || null;
  toastTimer = setTimeout(() => { el.style.display = "none"; if (toastDone) { toastDone(); toastDone = null; } }, btn ? 6000 : 2500);
}

  ["shop", "🛍 必買", (x) => [x.name, x.where, x.who, x.note], (x) => x.where || x.cat],

function openSearch() {
  const dlg = $("#dlg"), f = $("#dlgForm"); dlg.onclose = null;
  f.innerHTML = `<input name="q" type="search" placeholder="搜尋景點、行程、訂位代號、花費、日記…" autocomplete="off"><div id="hits" style="margin-top:8px;min-height:120px"></div>
    <div class="row" style="margin-top:10px"><span class="sp"></span><button value="cancel" formnovalidate>關閉</button></div>`;
  const t = T(), q = f.elements.q;
  q.oninput = () => {
    const k = q.value.trim().toLowerCase();
    if (!k) return ($("#hits").innerHTML = "");
    const hits = [];
    for (const [kind, label, fields, sub] of SEARCH) for (const x of t[kind] || []) if (fields(x).some((v) => String(v || "").toLowerCase().includes(k))) hits.push([kind, label, x, sub(x)]);
    $("#hits").innerHTML = hits.length ? hits.slice(0, 50).map(([kind, label, x, sub]) => `<div class="hit" data-hit="${kind}:${x.id}"><span class="mut">${label}</span> <b>${esc(x.title || x.name || x.note || (x.text || "").slice(0, 30) || x.cat)}</b><div class="mut">${esc(sub || "")}</div></div>`).join("") : '<div class="empty">找不到</div>';
  };
  f.onclick = (e) => {
    const h = e.target.closest("[data-hit]"); if (!h) return;
    const [kind, id] = h.dataset.hit.split(":"), x = t[kind].find((y) => y.id === id);
    dlg.close("cancel");
    const tab = { itin: "itin", spots: "spots", books: "books", tickets: "tickets", exp: "exp", shop: "pack", diary: "itin", emerg: "fx" }[kind];
    if (kind === "diary") { filt.iv = "日記"; goTab("itin"); return setTimeout(() => openDiary(t, x.date), 50); }
    if (kind === "shop") filt.pk = "必買"; if (kind === "emerg") filt.tool = "緊急"; if (kind === "exp") filt.ex = "記帳"; if (kind === "itin") filt.iv = "清單";
    goTab(tab); setTimeout(() => openForm(kind, x), 50);
  };
  dlg.showModal(); setTimeout(() => q.focus(), 50);
}

      if (!trips) throw new Error("格式不對");
      trips.forEach((x) => { const base = newTrip(); Object.keys(base).forEach((k) => (x[k] ??= base[k])); const i = S.trips.findIndex((y) => y.id === x.id); i >= 0 ? (S.trips[i] = x) : S.trips.push(x); });
      S.cur = trips[0].id; save(); $("#dlg").close("cancel"); render(); alert(`已匯入 ${trips.length} 個旅程`);
    } catch (err) { alert("匯入失敗：" + err.message); }
  };
  const dlg = $("#dlg");
  dlg.onclose = () => {
    const act = dlg.returnValue; dlg.returnValue = "";
    const fd = new FormData(f);
    if (act === "login" || act === "register") {
      const em = fd.get("syncEmail"), pw = fd.get("syncPw");
      if (!em || !pw) return alert("請輸入 Email 和密碼");
      TravelSync[act](em, pw).catch((e) => alert("失敗：" + e.message));
      return;
    }
    if (act === "logout") { TravelSync.logout(); return; }
    if (act === "export") {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([JSON.stringify({ trips: S.trips }, null, 1)], { type: "application/json" }));
      a.download = `travel-backup-${today()}.json`; a.click(); S.lastExport = Date.now(); saveLocal(); render(); return;
    }

    if (act === "deltrip") {
      if (!confirm(`刪除「${t.name}」？無法復原`)) return;
      [...t.tickets, ...t.exp, ...t.shop, ...t.diary.flatMap((d) => d.photos)].forEach((k) => { if (k.fileId) { fdel(k.fileId); window.TravelSync && TravelSync.delFile(t, k.fileId); } });
      S.trips = S.trips.filter((x) => x.id !== t.id);
      S.deleted[t.id] = Date.now(); delete snap[t.id];
      window.TravelSync && TravelSync.remove(t.id, S.deleted[t.id]);
      if (!S.trips.length) S.trips.push(newTrip("我的旅程"));
      S.cur = S.trips[0].id; save(); render(); return;
    }
    if (act !== "ok") return;
    S.theme = fd.get("theme") || ""; S.fz = +fd.get("fz") || 1; S.mapc = fd.get("mapc") || ""; applyDisplay();
    t.name = fd.get("name").trim() || t.name; t.start = fd.get("start"); t.end = fd.get("end");
    t.cur = fd.get("cur"); t.home = fd.get("home");
    t.manualRate = parseFloat(fd.get("manualRate")) || 0; t.budget = parseFloat(fd.get("budget")) || 0;
    const ppl = fd.get("people").split(/[,，]/).map((s) => s.trim()).filter(Boolean);
    t.people = ppl.length ? [...new Set(ppl)] : ["我"];
    if (fd.has("share")) {
      const me = TravelSync.user.toLowerCase();
      const list = fd.get("share").split(/[,，;\s]+/).map((x) => x.trim().toLowerCase()).filter((x) => /.+@.+\..+/.test(x));
      if (list.length || t.shared) {
        if (!t.shared) [...t.tickets, ...t.exp, ...t.shop, ...t.diary.flatMap((d) => d.photos)].forEach((k) => k.fileId && delete S.upl[k.fileId]); // 檔案改傳到共享區
        t.shared = true; t.emails = [...new Set([me, ...list])];
        setTimeout(() => TravelApp.uploadPending(), 1500);
      }
    }
    const q = (fd.get("city") || "").trim();
    if (q !== (t.loc ? t.loc.q : "")) {
      if (!q) t.loc = null;
      else geoCity(q, t.cur).then((l) => { if (!l) return alert(`找不到「${q}」，換個寫法試試（例如英文）`); t.loc = { ...l, q }; save(); render(); }).catch(() => alert("城市查詢失敗（需要網路）"));
    }
    save(); render();
  };
  dlg.showModal();
}

function applyDisplay() {
  const r = document.documentElement;
  if (S.theme) r.dataset.theme = S.theme; else delete r.dataset.theme;
  if (S.mapc) r.dataset.map = S.mapc; else delete r.dataset.map;
  r.style.setProperty("--fz", S.fz || 1);
  document.querySelector('meta[name="theme-color"]').content = getComputedStyle(document.body).backgroundColor;
}
applyDisplay();
const onNet = () => document.body.classList.toggle("off", !navigator.onLine);
addEventListener("online", onNet); addEventListener("offline", onNet); onNet();
// 出發前預存地圖: 依序切到每一天(和全部景點), 讓底圖載入一次
async function preMap(t) {
  if (!navigator.onLine) return alert("要有網路才能預存");
  const dates = [...new Set(t.itin.map((i) => i.date).filter(Boolean))].sort();
  const list = [...dates, "全部景點"], b = () => $("#preBtn");
  for (let i = 0; i < list.length; i++) {
    filt.md = list[i]; render();
    if (b()) b().textContent = `預存中 ${i + 1}/${list.length}…`;
    await new Promise((r) => setTimeout(r, 2500));
    if (window.__map) { window.__map.zoomIn(); await new Promise((r) => setTimeout(r, 1500)); }
  }
  render(); alert("地圖預存完成：剛剛看過的區域，沒網路時也看得到");
}
function syncSection() {
  if (!FIREBASE_CONFIG) return "";
  const ts = window.TravelSync;
  if (!ts) return `<h3 style="margin-top:16px">雲端同步</h3><div class="mut">同步模組載入中（需要網路）</div>`;
  if (ts.user) return `<h3 style="margin-top:16px">雲端同步</h3><div class="mut">已登入 ${esc(ts.user)}・${esc(ts.state)}</div><div class="mut">票券、收據照片也會同步（超過約 700KB 的 PDF 除外）。</div><div class="row" style="margin-top:6px"><button value="logout" formnovalidate>登出</button></div>`;
  return `<h3 style="margin-top:16px">雲端同步</h3><div class="mut">登入後手機、電腦資料自動同步</div>
    <input name="syncEmail" type="email" placeholder="Email" autocomplete="username" style="margin-top:6px"><input name="syncPw" type="password" placeholder="密碼(至少6碼)" autocomplete="current-password" style="margin-top:6px">
    <div class="row" style="margin-top:6px"><button value="login" class="pri" formnovalidate>登入</button><button value="register" formnovalidate>第一次用：註冊</button></div>`;
}
// 給 sync.js 用的介面
window.TravelApp = {
  trips: () => S.trips,
  deleted: () => S.deleted,
  get: (id) => S.trips.find((t) => t.id === id),
  apply(trip) {
    if (S.deleted[trip.id] > (trip.mt || 0)) return;
    const base = newTrip(); Object.keys(base).forEach((k) => (trip[k] ??= base[k]));
    const i = S.trips.findIndex((t) => t.id === trip.id);
    // 新裝置上沒動過的預設旅程, 收到雲端資料時直接拿掉
    const blank = S.trips.length === 1 && !S.trips[0].mt && isBlank(S.trips[0]);
    if (i >= 0) S.trips[i] = trip; else if (blank) { delete snap[S.trips[0].id]; S.trips = [trip]; S.cur = trip.id; } else S.trips.push(trip);
    snap[trip.id] = tripKey(trip);
    saveLocal(); if (!$("#dlg").open) render();
  },
  remove(id) {
    S.trips = S.trips.filter((t) => t.id !== id); delete snap[id];
    if (!S.trips.length) S.trips.push(newTrip("我的旅程"));
    saveLocal(); if (!$("#dlg").open) render();
  },
  isBlank: (t) => isBlank(t),
  async uploadPending() {
    if (!window.TravelSync || !TravelSync.user) return;
    for (const t of S.trips) for (const it of [...t.tickets, ...t.exp, ...t.shop, ...t.diary.flatMap((d) => d.photos)]) {
      if (!it.fileId || S.upl[it.fileId]) continue;
      const b = await fget(it.fileId); if (!b) continue;
      try { const r = await TravelSync.putFile(t, it.fileId, b); if (r) { S.upl[it.fileId] = r === true ? 1 : "big"; saveLocal(); } } catch (e) { }
    }
  },
};
function isBlank(t) { return ["itin", "spots", "books", "tickets", "exp", "pack"].every((k) => !t[k].length) && !t.start; }

for (const t of S.trips) snap[t.id] = tripKey(t);
setTimeout(() => S.trips.forEach((t) => {
  const want = CUR2CC[t.cur];
  if (t.loc && t.loc.q && want && want !== "TW" && t.loc.cc && t.loc.cc !== want)
    geoCity(t.loc.q, t.cur).then((l) => { if (l && l.cc === want) { t.loc = { ...l, q: t.loc.q }; save(); render(); } }).catch(() => {});
}), 500);
// 舊資料沒有mt: 有內容的給1(要上傳), 沒動過的預設旅程給0(不上傳)
for (const t of S.trips) t.mt ||= isBlank(t) ? 0 : 1;
render();
loadRates();
// 同步模組要網路才載得到; 離線開啟的話, 等恢復網路再載
let syncLoaded = false;
const loadSync = () => { if (!FIREBASE_CONFIG || syncLoaded) return; import("./sync.js").then((m) => { syncLoaded = true; m.start(FIREBASE_CONFIG); }).catch(() => {}); };
loadSync(); addEventListener("online", loadSync);
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
  navigator.serviceWorker.addEventListener("message", (e) => { if (e.data && e.data.type === "updated") toast("有新版本", "更新", () => location.reload()); });
}
</script>
</body>
</html>
