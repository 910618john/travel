<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="description" content="出國用旅行手帳：花費分帳、匯率、行程、景點、訂位、電子票券、行李清單">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="旅行手帳">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&display=swap" media="print" onload="this.media='all'">
<title>旅行手帳</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1f2328;--mut:#6b7280;--line:#e5e7eb;--acc:#0f766e;--acc2:#ccfbf1;--red:#dc2626;--warn:#d97706}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#181b21;--fg:#e6e8eb;--mut:#9aa1ab;--line:#2a2f37;--acc:#2dd4bf;--acc2:#134e4a;--red:#f87171;--warn:#fbbf24}}
:root{color-scheme:light dark}:root[data-theme="light"]{color-scheme:light}:root[data-theme="dark"]{color-scheme:dark}
:root[data-theme="dark"]{--bg:#0f1115;--card:#181b21;--fg:#e6e8eb;--mut:#9aa1ab;--line:#2a2f37;--acc:#2dd4bf;--acc2:#134e4a;--red:#f87171;--warn:#fbbf24}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:calc(15px*var(--fz,1))/1.5 -apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif;padding-bottom:calc(70px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;align-items:center}
header select{flex:1;font-weight:600;font-size:calc(16px*var(--fz,1))}
main{max-width:760px;margin:0 auto;padding:12px 16px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1 1 0;min-width:0;white-space:nowrap;border:0;background:none;color:var(--mut);padding:8px 6px;font-size:calc(11px*var(--fz,1));display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:calc(19px*var(--fz,1));font-weight:400}
nav button.on{color:var(--acc);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
/* 長清單: 畫面外的卡片先不排版, 捲到才畫(大幅減少卡頓) */
#view .card{content-visibility:auto;contain-intrinsic-size:auto 88px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.mut{color:var(--mut);font-size:calc(13px*var(--fz,1))}
.big{font-size:calc(26px*var(--fz,1));font-weight:700}
h2{font-size:calc(17px*var(--fz,1));margin:14px 0 8px}
h3{font-size:calc(15px*var(--fz,1));margin:0 0 4px}
button,.btn{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:7px 12px;font-size:calc(14px*var(--fz,1));cursor:pointer}
.pri{background:var(--acc);border-color:var(--acc);color:#fff}
:root[data-theme="dark"] .pri{color:#042f2e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pri{color:#042f2e}}
.sm{padding:3px 8px;font-size:calc(12px*var(--fz,1))}
.del{color:var(--red)}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:8px;font:inherit;font-size:max(16px,calc(15px*var(--fz,1)))}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:#1f2328;color:#fff;border-radius:24px;padding:8px 8px 8px 16px;display:none;align-items:center;gap:10px;z-index:40;box-shadow:0 4px 14px #0005;white-space:nowrap}
#toast button{background:none;border:0;color:#5eead4;font-weight:700}
.hit{padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.hit:last-child{border:0}
textarea{min-height:70px}
label{display:block;font-size:calc(13px*var(--fz,1));color:var(--mut);margin:8px 0 3px}
.tag{display:inline-block;background:var(--acc2);color:var(--fg);border-radius:20px;padding:1px 9px;font-size:calc(12px*var(--fz,1))}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{white-space:nowrap;border-radius:20px}
.chips button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.done{opacity:.55}
.done h3{text-decoration:line-through}
dialog{border:0;border-radius:14px;padding:0;width:min(520px,94vw);background:var(--card);color:var(--fg)}
dialog::backdrop{background:#0008}
dialog form{padding:16px;max-height:85vh;overflow:auto}
.fab{position:fixed;right:16px;bottom:calc(80px + env(safe-area-inset-bottom));width:52px;height:52px;border-radius:50%;font-size:calc(26px*var(--fz,1));box-shadow:0 4px 12px #0004;z-index:4}
.empty{text-align:center;color:var(--mut);padding:30px 0}
table{width:100%;border-collapse:collapse;font-size:calc(14px*var(--fz,1))}
td{padding:5px 2px;border-bottom:1px solid var(--line)}
td.r{text-align:right;font-variant-numeric:tabular-nums}
a{color:var(--acc)}
.daybar{position:sticky;top:57px;background:var(--bg);padding:6px 0;font-weight:700;z-index:1}
.time{font-variant-numeric:tabular-nums;font-weight:600;min-width:46px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* iPhone Safari: 一般 div/tr 要有 cursor:pointer, 點擊才會傳到 document 的事件處理 */
[data-edit],[data-act],[data-tab],[data-f],[data-big],[data-say],[data-hit],[data-drag],[data-tip],[data-rmph],[data-d]{cursor:pointer;-webkit-tap-highlight-color:rgba(0,0,0,.06)}
main{padding-bottom:84px}
/* ===== 和風(data-style="wa"): 和紙底、藍染頁首青海波、朱色點綴、明朝體標題 ===== */

:root[data-style="wa"] body{background-color:var(--bg);background-image:var(--washi);background-size:180px}
:root[data-style="wa"] header{background-color:var(--hd);background-image:var(--seigaiha);background-size:56px 28px;border-bottom:3px solid var(--shu);color:var(--hdfg)}
:root[data-style="wa"] header select,:root[data-style="wa"] header button{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:var(--hdfg)}
:root[data-style="wa"] header select{font-family:var(--serif);font-weight:700;letter-spacing:.05em}
:root[data-style="wa"] header select option{color:#2b2520;background:#fffbf3}
:root[data-style="wa"] .card{border-radius:10px;box-shadow:0 1px 0 rgba(80,60,30,.06),0 2px 8px rgba(80,60,30,.05)}
:root[data-style="wa"] h2{font-family:var(--serif);font-weight:700;letter-spacing:.04em;border-left:4px solid var(--shu);padding-left:8px}
:root[data-style="wa"] h3,:root[data-style="wa"] .big{font-family:var(--serif);letter-spacing:.03em}
:root[data-style="wa"] .chips button{border-radius:6px}
:root[data-style="wa"] .fab{background:var(--shu);border-color:var(--shu);color:#fff}
:root[data-style="wa"] nav{background:var(--card);border-top:2px solid var(--shu)}
:root[data-style="wa"] nav button.on{color:var(--shu)}
:root[data-style="wa"] nav button.on b{position:relative}
:root[data-style="wa"] nav button.on b::after{content:"";position:absolute;left:50%;bottom:-3px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--shu)}
:root[data-style="wa"] .hero{background-color:var(--hd);background-image:var(--seigaiha);background-size:56px 28px;color:var(--hdfg);border:0;position:relative;overflow:hidden}
:root[data-style="wa"] .hero .mut{color:rgba(246,240,228,.75)}
:root[data-style="wa"] .hero::after{content:"";position:absolute;right:-18px;top:-18px;width:96px;height:96px;border-radius:50%;background:var(--shu);opacity:.9}
:root[data-style="wa"] .hero>*{position:relative;z-index:1}

<script>
"use strict";
// ===== 儲存 =====
const KEY = "travel_v1";
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const today = () => new Date().toLocaleDateString("sv");

function newTrip(name) {
  return { id: uid(), name: name || "新旅程", start: "", end: "", home: "TWD", cur: "JPY", people: ["我"], budget: 0, manualRate: 0,
    itin: [], spots: [], books: [], tickets: [], exp: [], pack: [], emerg: [], phr: [], loc: null, wallet: [], prep: {}, shop: [], diary: [], coupons: [], tcard: [] };
}
let S;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
if (!S || !S.trips || !S.trips.length) { const t = newTrip("我的旅程"); S = { trips: [t], cur: t.id, tab: "home", rates: null }; }
// 雲端同步: 填入 Firebase 設定後啟用(見 README), null = 只存本機
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDRSrNJZd5C3Nrz_mX8TaY65PKBSmz1Wbw",
  authDomain: "travel-672ff.firebaseapp.com",
  projectId: "travel-672ff",
  storageBucket: "travel-672ff.firebasestorage.app",
  messagingSenderId: "1000112370662",
  appId: "1:1000112370662:web:bcb195ec1513d002e65c27",
};
S.deleted ||= {};
if ((S.gkey || S.me) && !S.setMt) S.setMt = 1; // 舊版本機設定: 給最舊的時間, 雲端有就以雲端為準
// 每個旅程記最後修改時間 mt, 同步時以 mt 較新者為準
const snap = {};
const tripKey = (t) => JSON.stringify({ ...t, mt: 0 });
const saveLocal = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { alert("儲存失敗：" + e.message); } };
const save = () => {
  for (const t of S.trips) {
    const j = tripKey(t);
    if (snap[t.id] === j) continue;
    if (snap[t.id] !== undefined || !t.mt) t.mt = Date.now();
    snap[t.id] = j;
    pushQ.add(t.id);
  }
  saveLocal();
  clearTimeout(pushTimer); pushTimer = setTimeout(flushPush, 800);
};
const pushQ = new Set(); let pushTimer;
function flushPush() {
  clearTimeout(pushTimer);
  if (!window.TravelSync) return;
  for (const id of pushQ) { const t = S.trips.find((x) => x.id === id); if (t) TravelSync.push(t); }
  pushQ.clear();
}
// 關掉或切到背景前, 把還沒傳的送出去
addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") flushPush();
  else loadRates(); // 切回來時, 超過 6 小時就重抓匯率
});
addEventListener("pagehide", flushPush);
// 舊版建立的旅程缺新功能的欄位(錢包、日記、必買…), 載入時補上預設值
function fillTrip(t) { const base = newTrip(); for (const k of Object.keys(base)) if (t[k] == null) t[k] = base[k]; return t; }
S.trips.forEach(fillTrip);
const T = () => { const t = S.trips.find((x) => x.id === S.cur) || S.trips[0]; return t.diary && t.shop ? t : fillTrip(t); };

// 票券檔案存 IndexedDB(localStorage 只有 ~5MB)
const idb = new Promise((res, rej) => {
  const r = indexedDB.open("travel_files", 1);
  r.onupgradeneeded = () => r.result.createObjectStore("f");
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
});
async function fput(id, blob) { const db = await idb; return new Promise((res, rej) => { const tx = db.transaction("f", "readwrite"); tx.objectStore("f").put(blob, id); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }
async function fget(id) { const db = await idb; return new Promise((res) => { const r = db.transaction("f").objectStore("f").get(id); r.onsuccess = () => res(r.result); r.onerror = () => res(null); }); }
async function fdel(id) { const db = await idb; db.transaction("f", "readwrite").objectStore("f").delete(id); }

// ===== 匯率 =====
const CURS = ["TWD", "JPY", "KRW", "USD", "EUR", "GBP", "CNY", "HKD", "MOP", "THB", "SGD", "MYR", "VND", "PHP", "IDR", "AUD", "NZD", "CAD", "CHF", "CZK", "TRY", "AED"];
async function loadRates(force) {
  if (!force && S.rates && Date.now() - S.rates.ts < 6 * 3600e3) return;
  try {
    const r = await fetch("https://open.er-api.com/v6/latest/USD");
    const j = await r.json();
    if (j.result === "success") { S.rates = { ts: Date.now(), r: j.rates }; save(); render(); }
  } catch (e) { if (force) alert("匯率更新失敗，使用快取"); }
}
// 回傳 1 單位 from = ? to
function rate(from, to) {
  if (from === to) return 1;
  const t = T();
  if (t.manualRate > 0) {
    if (from === t.cur && to === t.home) return t.manualRate;
    if (from === t.home && to === t.cur) return 1 / t.manualRate;
  }
  const R = S.rates && S.rates.r;
  if (!R || !R[from] || !R[to]) return NaN;
  return R[to] / R[from];
}
const toHome = (amt, cur) => { const v = (+amt || 0) * rate(cur, T().home); return isFinite(v) ? v : 0; };
const ago = (ts) => { const m = Math.round((Date.now() - ts) / 6e4); return m < 60 ? `${Math.max(1, m)} 分鐘前` : m < 1440 ? `${Math.round(m / 60)} 小時前` : `${Math.round(m / 1440)} 天前`; };
const NF = {};
const fmt = (n, d = 0) => isFinite(n) ? (NF[d] ||= new Intl.NumberFormat("zh-TW", { maximumFractionDigits: d, minimumFractionDigits: 0 })).format(n) : "—";

// ===== 欄位定義(通用表單) =====
const EXP_CATS = ["餐飲", "交通", "住宿", "門票", "購物", "伴手禮", "通訊", "機票", "其他"];
const SPOT_CATS = ["景點", "美食", "購物", "咖啡", "夜生活", "自然", "博物館", "其他"];
const BOOK_TYPES = ["機票", "住宿", "交通", "租車", "保險", "其他"];
const TK_CATS = ["機票", "住宿", "車票/交通卡", "門票", "餐廳預約", "保險/證件", "其他"];
const BAGS = ["托運", "隨身", "身上"];
const SHOP_CATS = ["伴手禮", "藥妝", "零食", "電器", "衣服鞋包", "其他"];
// 同一天行程的順序: 拖拉過就用 ord, 沒排過照時間
const byOrd = (a, b) => (a.ord ?? 1e9) - (b.ord ?? 1e9) || (a.time || "99").localeCompare(b.time || "99");
// 新增或改時間時, 把它插到已排序的同一天裡「時間對的位置」
function placeByTime(t, it) {
  const day = t.itin.filter((x) => x !== it && x.date === it.date);
  if (!day.some((x) => x.ord != null)) { delete it.ord; return; }
  const arr = day.sort(byOrd);
  // 放在「最後一個時間 ≤ 它」的後面; 都比它晚就放最前面; 沒時間放最後
  let idx = arr.length;
  if (it.time) {
    const before = arr.map((x, i) => (x.time && x.time <= it.time ? i : -1)).filter((i) => i >= 0);
    idx = before.length ? before[before.length - 1] + 1 : arr.findIndex((x) => x.time) >= 0 ? arr.findIndex((x) => x.time) : arr.length;
  }
  arr.splice(idx, 0, it);
  arr.forEach((x, i) => (x.ord = i));
}
// 行程類型(顏色/圖示); 舊行程沒填就依名稱判斷
const ICATS = [["景點", "🏛"], ["住宿", "🏨"], ["美食", "🍜"], ["交通", "🚃"], ["購物", "🛍"], ["其他", "📌"]];
const icatOf = (i) => i.cat || (/住宿|飯店|酒店|旅館|民宿|入住|退房|check.?in|check.?out|hotel|ホテル|旅館|hostel|resort/i.test(`${i.title} ${i.place || ""}`) ? "住宿" : /餐|吃|食|拉麵|壽司|燒肉|咖啡|早午餐|屋台|居酒屋|cafe|restaurant/i.test(i.title) ? "美食" : /機場|車站|搭車|新幹線|巴士|航班|flight|airport|station/i.test(i.title) ? "交通" : "景點");
const icatIcon = (c) => (ICATS.find((x) => x[0] === c) || ICATS[0])[1];

  const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=zh-TW${cc}&q=${encodeURIComponent(q)}`);
  const j = await r.json();
  return j[0] ? [+j[0].lat, +j[0].lon] : null;
}
const GEOV = 2; // 定位方式改進過就換數字, 之前失敗的會再試一次
const needGeo = (x) => x.lat == null && x.geoFail !== GEOV;
async function photon(q) {
  const r = await fetch(`https://photon.komoot.io/api/?limit=1&q=${encodeURIComponent(q)}`);
  const f = ((await r.json()).features || [])[0];
  return f ? [f.geometry.coordinates[1], f.geometry.coordinates[0]] : null;
}
// 依序試: 原地址 → 去掉郵遞區號/國名 → 去掉門牌只留區域 → 名稱(機場/車站換當地用字); Nominatim 找不到再用 Photon
function geoQueries(place, name) {
  const qs = [], add = (q) => { q = (q || "").replace(/\s+/g, " ").replace(/^[\s,，]+|[\s,，]+$/g, ""); if (q && !qs.includes(q)) qs.push(q); };
  if (!isUrl(place)) {
    add(place);
    const p2 = (place || "").replace(/〒?\s*\d{3}-?\d{4}/g, "").replace(/(日本|Japan|台灣|Taiwan|大韓民國|South Korea|韓國|Thailand|泰國)\s*$/i, "");
    add(p2);
    const parts = p2.split(/[,，]/).map((x) => x.trim()).filter(Boolean);
    if (parts.length > 1 && /\d/.test(parts[0])) add([parts[0].replace(/^[\d\-−‐ ]+/, ""), ...parts.slice(1)].join(", "));
    if (parts.length > 2) { add(name); add((name || "").replace(/機場/g, "空港").replace(/車站$/, "駅")); add(parts.slice(1).join(", ")); } // 只剩區域最不準, 放最後
  }
  add(name);
  add((name || "").replace(/機場/g, "空港").replace(/車站$/, "駅"));
  return qs;
}
async function geoFind(place, name, t) {
  let c = coordFromLink(place); if (c) return c;
  const qs = geoQueries(place, name);
  for (const q of qs) {
    try { c = await geocode(q, t); } catch (e) { }
    await new Promise((r) => setTimeout(r, 1100)); // Nominatim 限每秒1次
    if (c) return c;
  }
  for (const q of qs) { try { c = await photon(q); } catch (e) { } if (c) return c; }
  return null;
}
async function geoAll(t) {
  const list = [...t.itin.map((i) => [i, i.place, i.title]), ...t.spots.map((s) => [s, s.addr, s.name + (s.city ? " " + s.city : "")]), ...bookHotels(t).map((h) => [h, h.from, h.title])].filter(([x]) => needGeo(x));
  if (!list.length) return alert("全部都定位過了");
  const btn = $("#geoBtn"); let n = 0, ok = 0;
  for (const [x, place, name] of list) {
    if (btn) btn.textContent = `定位中 ${++n}/${list.length}…`;
    const c = await geoFind(place, name, t);
    if (c) { x.lat = c[0]; x.lon = c[1]; ok++; } else x.geoFail = GEOV;
  }
  save(); render();
  alert(`定位完成：${ok}/${list.length}` + (ok < list.length ? "\n找不到的可以編輯地點，改成更完整的地址或貼含座標的 Google 地圖連結" : ""));
}
// 行事曆那天還沒定位的行程, 背景自動定位(估交通時間要座標); 一次一個, 照 Nominatim 每秒 1 次
let geoBusy = false;
async function autoGeoDay(t, d) {
  if (geoBusy || !navigator.onLine) return;
  const list = routeSeq(t, d).map((v) => v.i).filter(needGeo); if (list.length < 1 || routeSeq(t, d).length < 2) return;
  geoBusy = true; let changed = false;
  try {
    for (const x of list) {
      const c = await geoFind(x.place, x.title, t);
      if (c) { x.lat = c[0]; x.lon = c[1]; } else x.geoFail = GEOV;
      changed = true;
    }
  } finally { geoBusy = false; }
  if (changed) { save(); render(); }
}
async function initMap(t) {

      .addTo(m).bindPopup(`<b>${esc(s.name)}</b><br>${esc(s.prio)}・${esc(s.cat)}<br>${nav(s)}`);

  else if (t.loc) m.setView([t.loc.lat, t.loc.lon], 12);

}

function itinText(t) {
  let s = `${t.name}\n${t.start || ""}～${t.end || ""}\n`;
  const by = {}; t.itin.forEach((i) => (by[i.date || "未定"] ||= []).push(i));
  const startD = t.start ? new Date(t.start + "T00:00") : null;
  for (const d of Object.keys(by).sort()) {
    const n = startD && d !== "未定" ? Math.round((new Date(d + "T00:00") - startD) / 864e5) + 1 : null;
    s += `\n【${n ? `Day ${n} ` : ""}${d}${dayName(d) ? "(" + dayName(d) + ")" : ""}】${wxTxt(wxOf(t, d))}\n`;
    for (const i of by[d].sort(byOrd))
      s += `${i.time || "--:--"} ${i.title}${i.place && !isUrl(i.place) ? "＠" + i.place : ""}\n`;
  }
  return s;
}

let tessP;
const loadTess = () => (tessP ||= new Promise((res, rej) => { const sc = document.createElement("script"); sc.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"; sc.onload = () => res(window.Tesseract); sc.onerror = () => { tessP = null; rej(new Error("載入失敗")); }; document.head.appendChild(sc); }));
async function shrink(file, max = 1600, q = 0.85) {
  const img = await createImageBitmap(file);
  const k = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return new Promise((r) => c.toBlob(r, "image/jpeg", q));
}
// 存檔: 照片壓成 JPEG(省空間, 也才放得進雲端), 存本機 IndexedDB, 有登入就上傳
S.upl ||= {};
async function storeFile(t, file) {
  let blob = file, name = file.name || "檔案", type = file.type || "";
  if (/^image\//.test(type) && !/gif|svg/.test(type)) {
    blob = await shrink(file, 1600);
    if (blob.size > 650000) blob = await shrink(file, 1200, 0.75);
    type = "image/jpeg"; name = name.replace(/\.\w+$/, "") + ".jpg";
  }
  const fileId = uid(); await fput(fileId, blob);
  if (window.TravelSync && TravelSync.user) TravelSync.putFile(t, fileId, blob).then((r) => {
    if (!r) return; S.upl[fileId] = r === true ? 1 : "big"; saveLocal();
    if (r === "big") alert("檔案超過約 700KB，不會同步到雲端，只存在這台裝置");
  }).catch(() => {});
  return { fileId, fileName: name, fileType: type };
}
function parseTotal(text) {
  const nums = (l) => (l.replace(/(\d)[,，](?=\d{3}\b)/g, "$1").match(/\d+(?:\.\d{1,2})?/g) || []).map(Number).filter((n) => n > 0 && n < 1e8);
  const SKIP = /お預|預り|釣|CHANGE|Change|change|TENDER|Tender|CASH|Cash|거스름|받은|ทอน|รับเงิน|Rückgeld|Gegeben/;
  const STRONG = /合\s*計|合计|総\s*計|お会計|TOTAL|Total|total|합\s*계|총\s*액|결제금액|รวมทั้งสิ้น|ยอดรวม|ยอดสุทธิ|Summe|SUMME|Gesamt|Totale|TOTALE|Tổng/;
  const WEAK = /計|Amount|AMOUNT|결제|รวม|Betrag/;
  const lines = text.split(/\n/).filter((l) => !SKIP.test(l));
  for (const re of [STRONG, WEAK]) {
    const v = lines.filter((l) => re.test(l)).flatMap(nums);
    if (v.length) return Math.max(...v);
  }
  return 0;
}
async function doOcr(file) {
  const t = T();
  const lang = { JPY: "jpn+eng", KRW: "kor+eng", CNY: "chi_sim+eng", HKD: "chi_tra+eng", MOP: "chi_tra+eng", TWD: "chi_tra+eng", THB: "tha+eng" }[t.cur] || "eng";
  const st = $("#ocrSt"); const say = (m) => (st ? (st.textContent = m) : m && toast(m));
  say("處理照片…");
  const fobj = await storeFile(t, file); const blob = await fget(fobj.fileId);
  let amt = 0, hint = "";
  try {
    say("辨識中…第一次要下載語言檔，約 10~30 秒");
    const Ts = await loadTess();
    const r = await Promise.race([
      (async () => { const w = await Ts.createWorker(lang); try { return await w.recognize(blob); } finally { w.terminate(); } })(),
      new Promise((_, rej) => setTimeout(() => rej(new Error("逾時")), 90000)),
    ]);
    amt = parseTotal(r.data.text);
    hint = amt ? `📷 辨識到金額 ${fmt(amt, 2)}，請確認` : "📷 沒抓到金額，請手動輸入（照片已附上）";
  } catch (e) { hint = "📷 辨識失敗（需要網路），請手動輸入（照片已附上）"; }
  say("");
  openForm("exp", null, null, { amt: amt || "", ...fobj, _hint: hint });
}

const barPath = (x, y, w, h) => { const r = Math.min(4, w / 2, h); return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`; };
// rows: [{k: x軸標籤, v: 值, tip: 提示文字, warn: 超標}]; ref: 參考線(例如每日預算)
function barChart(rows, ref, refLabel) {
  const W = 340, H = 160, pl = 40, pb = 20, pt = 10, ph = H - pt - pb;
  const raw = Math.max(1, ref || 0, ...rows.map((r) => r.v)) * 1.08, mag = 10 ** Math.floor(Math.log10(raw));
  const max = [1, 2, 2.5, 5, 10].map((k) => k * mag).find((v) => v >= raw);
  const y = (v) => pt + ph * (1 - v / max), slot = (W - pl) / rows.length, bw = Math.max(3, Math.min(26, slot - 2));
  const step = Math.ceil(rows.length / 7);
  let g = [0, max / 2, max].map((v) => `<line x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line)"/><text x="${pl - 4}" y="${y(v) + 4}" text-anchor="end" style="fill:var(--mut);font-size:calc(10px*var(--fz,1))">${fmtK(v)}</text>`).join("");
  g += rows.map((r, i) => {
    const x = pl + i * slot + (slot - bw) / 2, h = Math.max(0, ph * (r.v / max));
    return `${r.v > 0 ? `<path d="${barPath(x, pt + ph - h, bw, h)}" style="fill:${r.warn ? "var(--red)" : "var(--acc)"}"/>` : ""}
      <rect x="${pl + i * slot}" y="${pt}" width="${slot}" height="${ph}" fill="transparent" data-tip="${esc(r.tip)}"/>
      ${i % step === 0 ? `<text x="${x + bw / 2}" y="${H - 5}" text-anchor="middle" style="fill:var(--mut);font-size:calc(10px*var(--fz,1))">${esc(r.k)}</text>` : ""}`;
  }).join("");
  if (ref) g += `<line x1="${pl}" x2="${W}" y1="${y(ref)}" y2="${y(ref)}" style="stroke:var(--fg);stroke-width:1.5;stroke-dasharray:4 3;opacity:.6"/><text x="${W}" y="${y(ref) - 4}" text-anchor="end" style="fill:var(--fg);font-size:calc(10px*var(--fz,1))">${esc(refLabel)} ${fmtK(ref)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img">${g}</svg>`;
}
// pts: [{k, v, tip}] 折線 + 十字線提示
function lineChart(pts, dec = 4) {
  const W = 340, H = 150, pl = 46, pb = 20, pt = 12, ph = H - pt - pb;
  const vs = pts.map((p) => p.v), lo = Math.min(...vs), hi = Math.max(...vs), pad = (hi - lo || hi * 0.01) * 0.15;
  const min = lo - pad, max = hi + pad;
  const x = (i) => pl + ((W - pl - 8) * i) / (pts.length - 1), y = (v) => pt + ph * (1 - (v - min) / (max - min));
  let g = [min + pad, (min + max) / 2, max - pad].map((v) => `<line x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line)"/><text x="${pl - 4}" y="${y(v) + 4}" text-anchor="end" style="fill:var(--mut);font-size:calc(10px*var(--fz,1))">${fmt(v, dec)}</text>`).join("");
  g += `<path d="${pts.map((p, i) => (i ? "L" : "M") + x(i).toFixed(1) + "," + y(p.v).toFixed(1)).join("")}" style="fill:none;stroke:var(--acc);stroke-width:2;stroke-linejoin:round"/>`;
  const L = pts.length - 1;
  g += `<circle cx="${x(L)}" cy="${y(pts[L].v)}" r="4" style="fill:var(--acc);stroke:var(--card);stroke-width:2"/>`;
  g += [0, Math.floor(L / 2), L].map((i) => `<text x="${x(i)}" y="${H - 5}" text-anchor="${i === 0 ? "start" : i === L ? "end" : "middle"}" style="fill:var(--mut);font-size:calc(10px*var(--fz,1))">${esc(pts[i].k)}</text>`).join("");
  g += `<line class="gx" x1="0" x2="0" y1="${pt}" y2="${pt + ph}" style="stroke:var(--mut);stroke-width:1;display:none"/>`;
  const sw = (W - pl) / pts.length;
  g += pts.map((p, i) => `<rect x="${x(i) - sw / 2}" y="${pt}" width="${sw}" height="${ph}" fill="transparent" data-tip="${esc(p.tip)}" data-gx="${x(i)}"/>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img">${g}</svg>`;
}
// 提示框: 滑鼠移過或手指點到 data-tip
(() => {
  const tip = document.createElement("div"); tip.id = "ctip"; document.body.appendChild(tip);
  const show = (e) => {
    const el = e.target.closest && e.target.closest("[data-tip]");
    if (!el && tip.style.display === "none") return;
    document.querySelectorAll("svg .gx").forEach((l) => (l.style.display = "none"));
    if (!el) return (tip.style.display = "none");
    tip.textContent = el.dataset.tip; tip.style.display = "block";
    const w = tip.offsetWidth; tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, e.clientX - w / 2)) + "px"; tip.style.top = Math.max(8, e.clientY - 44) + "px";
    if (el.dataset.gx) { const l = el.ownerSVGElement.querySelector(".gx"); l.setAttribute("x1", el.dataset.gx); l.setAttribute("x2", el.dataset.gx); l.style.display = ""; }
  };
  let raf = 0, last;
  document.addEventListener("pointermove", (e) => { last = e; if (!raf) raf = requestAnimationFrame(() => { raf = 0; show(last); }); }, { passive: true });
  document.addEventListener("pointerdown", show, { passive: true });
  document.addEventListener("scroll", () => { if (tip.style.display !== "none") tip.style.display = "none"; }, { capture: true, passive: true });
})();

// ===== 旅程日期 / 每日預算 =====
function tripDays(t) {

  if (t.start && t.end) for (let d = new Date(t.start + "T00:00"); d <= new Date(t.end + "T00:00") && out.length < 60; d.setDate(d.getDate() + 1)) out.push(d.toLocaleDateString("sv"));
  return out;
}
const dailyBudget = (t) => { if (t.dbudget) return t.dbudget; const n = tripDays(t).length; return t.budget && n ? t.budget / n : 0; };

function fxHistHtml(t) {

// ===== 現金錢包 =====
function walletHtml(t) {
  if (!t.wallet.length) return `<div class="card row"><span class="sp mut">💴 現金錢包：記下換了多少外幣，用「現金」記帳會自動扣，隨時知道還剩多少</span><button class="sm" data-act="addwallet">＋ 換匯</button></div>`;
  const curs = [...new Set(t.wallet.map((w) => w.cur))];
  const rows = curs.map((c) => {
    const ws = t.wallet.filter((w) => w.cur === c), got = ws.reduce((s, w) => s + (+w.amt || 0), 0);
    const spent = t.exp.filter((e) => e.cur === c && e.pay === "現金").reduce((s, e) => s + (+e.amt || 0), 0);
    const paid = ws.filter((w) => w.cost > 0), pAmt = paid.reduce((s, w) => s + (+w.amt || 0), 0), pCost = paid.reduce((s, w) => s + w.cost, 0);
    const bal = got - spent;

  }).join("");
  return `<div class="card"><div class="row"><h3 class="sp">💴 現金錢包・剩餘</h3><button class="sm" data-act="addwallet">＋ 換匯</button><button class="sm" data-act="walletlist">紀錄</button></div><table>${rows}</table>
    ${filt.wl ? `<div style="margin-top:6px">${t.wallet.slice().sort((a, b) => (b.date || "").localeCompare(a.date || "")).map((w) => `<div class="row mut" data-edit="wallet:${w.id}" style="padding:4px 0;border-top:1px solid var(--line)"><span class="sp">${w.date || ""} ${esc(w.note || "換匯")}</span><span>${fmt(w.amt, 2)} ${w.cur}${w.cost ? `（${fmt(w.cost)} ${t.home}）` : ""}</span></div>`).join("")}</div>` : ""}
    ${rows.includes("color:var(--red)") ? '<div class="mut" style="color:var(--red)">餘額是負的：可能有換匯沒記到，或現金付款記錯</div>' : ""}</div>`;
}

// ===== 交通方式(行程之間) =====
function distKm(a, b) {
  if (a.lat == null || b.lat == null) return null;
  const R = 6371, r = Math.PI / 180, dLa = (b.lat - a.lat) * r, dLo = (b.lon - a.lon) * r;
  const h = Math.sin(dLa / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLo / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
// 有打地址就用地址(自動定位可能只到區), 貼連結的才用座標
const geoQ = (x) => x.place && !isUrl(x.place) ? x.place : x.lat != null ? `${x.lat},${x.lon}` : x.title;

function mapsDirUrl(a, b, tm) {
  const q = `saddr=${encodeURIComponent(geoQ(a))}&daddr=${encodeURIComponent(geoQ(b))}&dirflg=${{ walking: "w", driving: "d" }[tm] || "r"}`;
  const t0 = a.end || a.time;
  if (!a.date || !t0) return `https://www.google.com/maps?${q}`;
  const [y, mo, d] = a.date.split("-"), [hh, mm] = t0.split(":").map(Number);
  const time = `${(hh % 12) || 12}:${String(mm).padStart(2, "0")}${hh < 12 ? "am" : "pm"}`;
  return `https://www.google.com/maps?${q}&ttype=dep&date=${+mo}/${+d}/${y.slice(2)}&time=${encodeURIComponent(time)}`;
}
// 交通時間: 有填用填的; 沒填但有座標, 依交通方式估(直線距離×1.3 繞路)
function travelMin(a, b) {

  const gt = b.gtravel && b.gtravel.k === routeKey(a, b) ? b.gtravel : null;
  if (gt && routeMode(b) === "transit" && gt.m > 15 && gt.steps && !gt.steps.some((x) => x.v != null)) gt.nt = true; // 舊的查詢結果也套用
  if (gt && !gt.nt) return gt.m != null ? { m: gt.m, est: false, g: true, steps: gt.steps || [] } : null;
  const nt = !!gt; // Google 只給步行(日本等地 API 沒有電車資料) → 用估算
  const d = distKm(a, b); if (d == null) return null;
  const mode = (MODES.find((x) => x[0] === b.mode) || [, "transit"])[1];
  const km = d * 1.3, rail = mode === "transit" && !/公車/.test(b.mode || "") && railEst(a, b, d);

// ===== 電車估算(日本等 Google 給不出電車的地方): 起點、終點各找最近的車站 → 走到站 + 搭車 + 等車轉乘 + 走出站 =====
S.stc ||= {};
const stKey = (x) => x.lat != null ? `${x.lat.toFixed(3)},${x.lon.toFixed(3)}` : null;

  if (A.n === B.n || d < 1.2 || wA + wB > d * 1.3) return null; // 同一站或很近: 走路比較快, 交給一般估算

// ===== Google 路線(Routes API): 有金鑰就用 Google 算真實交通時間, 結果存在行程上 =====

// ===== 營業時間提醒 =====
const WD_ZH = { 日: 0, 天: 0, 一: 1, 二: 2, 三: 3, 四: 4, 五: 5, 六: 6 }, WD_JA = { 日: 0, 月: 1, 火: 2, 水: 3, 木: 4, 金: 5, 土: 6 }, WD_EN = { sun: 0, mon: 1, tue: 2, wed: 3, thu: 4, fri: 5, sat: 6 };
function weekdaysIn(w) {
  const out = [];
  for (const m of w.matchAll(/(?:週|周|星期|禮拜)([一二三四五六日天])/g)) out.push(WD_ZH[m[1]]);
  for (const m of w.matchAll(/([月火水木金土日])曜/g)) out.push(WD_JA[m[1]]);
  for (const m of w.matchAll(/\b(sun|mon|tue|wed|thu|fri|sat)[a-z]*/gi)) out.push(WD_EN[m[1].toLowerCase()]);
  return out;
}
// "10:00-18:00 週一公休" / "11:00〜22:00（定休日：水曜）" / "Mon closed" → {open, close(分鐘), closed:Set(星期)}
function parseHours(s) {
  if (!s) return null;
  const r = { closed: new Set() };
  // 可能有好幾段: "11:30-14:00, 17:00-22:00" 或 "11:30-22:00 休息14:00-17:00"(中間休息=空班)
  const rs = [...s.matchAll(/(\d{1,2})[:：]?(\d{2})\s*[-~〜～–—至到]\s*(\d{1,2})[:：]?(\d{2})/g)].map((m) => {
    const a = +m[1] * 60 + +m[2]; let b = +m[3] * 60 + +m[4]; if (b <= a) b += 1440;
    return { a, b, brk: /(休息|午休|中休|休憩|空班|準備中|break)\s*[:：]?\s*$/i.test(s.slice(Math.max(0, m.index - 6), m.index)) };
  });
  const opens = rs.filter((x) => !x.brk).sort((x, y) => x.a - y.a);
  if (opens.length) {
    r.open = opens[0].a; r.close = Math.max(...opens.map((x) => x.b));
    r.breaks = rs.filter((x) => x.brk).map((x) => [x.a, x.b]);
    for (let k = 1; k < opens.length; k++) if (opens[k].a > opens[k - 1].b) r.breaks.push([opens[k - 1].b, opens[k].a]);
  }
  if (/24\s*(小時|時間|h|hours)/i.test(s)) { r.open = 0; r.close = 1440; }
  for (const mm of s.matchAll(/公休|定休日?|休館日?|店休|休業|休み|closed|休/gi)) weekdaysIn(s.slice(Math.max(0, mm.index - 12), mm.index + mm[0].length + 10)).forEach((d) => r.closed.add(d));
  return r.open != null || r.closed.size ? r : null;
}
const hm = (n) => `${String(Math.floor(n / 60) % 24).padStart(2, "0")}:${String(n % 60).padStart(2, "0")}`;
function hoursWarn(i, t) {
  const sp = (i.spotId && t.spots.find((s) => s.id === i.spotId)) || t.spots.find((s) => s.name === i.title);
  const h = parseHours(i.hours || (sp && sp.hours));
  if (!h || !i.date) return "";
  const wd = new Date(i.date + "T00:00").getDay();
  if (h.closed.has(wd)) return `⚠️ 星期${"日一二三四五六"[wd]}公休`;
  if (i.time && h.open != null && h.close - h.open < 1440) {
    const tm = +i.time.slice(0, 2) * 60 + +i.time.slice(3, 5);
    if (h.close > 1440 && tm < h.open && tm >= h.close - 1440) return `⚠️ ${hm(h.close)} 已打烊`; // 跨夜營業, 清晨已關
    const tt = tm < h.open && tm + 1440 < h.close ? tm + 1440 : tm;
    if (tt < h.open) return `⚠️ ${hm(h.open)} 才開`;
    if (tt >= h.close) return `⚠️ ${hm(h.close)} 已打烊`;
    for (const [bs, be] of h.breaks || []) {
      if (tt >= bs && tt < be) return `⚠️ ${hm(bs)}–${hm(be)} 休息中`;
      if (tt >= bs - 30 && tt < bs) return `⚠️ ${hm(bs)} 開始休息`;
    }
    if (tt >= h.close - 45) return `⚠️ 快打烊（${hm(h.close)}）`;
  }
  return "";
}

function settleCalc(t) {
  const paid = Object.fromEntries(t.people.map((p) => [p, 0])), owe = { ...paid };
  for (const e of t.exp) {
    const v = toHome(e.amt, e.cur), sp = (e.split && e.split.length ? e.split : t.people).filter((p) => p in owe);
    if (!sp.length || !isFinite(v)) continue;
    if (e.payer in paid) paid[e.payer] += v;
    sp.forEach((p) => (owe[p] += v / sp.length));
  }
  const bal = t.people.map((p) => [p, paid[p] - owe[p]]);
  const pos = bal.filter(([, v]) => v > 0.5).sort((a, b) => b[1] - a[1]).map((x) => [...x]);
  const neg = bal.filter(([, v]) => v < -0.5).sort((a, b) => a[1] - b[1]).map((x) => [...x]);
  const tr = []; let i = 0, j = 0;
  while (i < pos.length && j < neg.length) {
    const m = Math.min(pos[i][1], -neg[j][1]);
    tr.push([neg[j][0], pos[i][0], m]);
    pos[i][1] -= m; neg[j][1] += m;
    if (pos[i][1] < 0.5) i++; if (neg[j][1] > -0.5) j++;
  }
  return { paid, owe, tr };
}
function settleText(t) {
  const { paid, owe, tr } = settleCalc(t), H = t.home;
  return [`💰 ${t.name} 分帳`, "", ...t.people.map((p) => `${p}：付了 ${fmt(paid[p])}，應付 ${fmt(owe[p])}`), "",
    tr.length ? "👉 轉帳：" : "✅ 已結清", ...tr.map(([a, b, m]) => `${a} → ${b}：${fmt(m)} ${H}`)].join("\n");
}

// 待排景點拖進行事曆: 放開的位置就是開始時間(15 分鐘一格), 預設 1.5 小時

// 行程移回待排景點: 原本從景點排進來的直接拿掉; 自己新增的先變成一個景點
function unschedule(t, it) {
  const idx = t.itin.indexOf(it); let made = null;
  if (!(it.spotId && t.spots.some((s) => s.id === it.spotId))) {
    made = { id: uid(), name: it.title, cat: { 美食: "美食", 購物: "購物" }[icatOf(it)] || "景點", prio: "想去", addr: it.place || "", hours: it.hours || "", note: it.note || "", lat: it.lat, lon: it.lon };
    t.spots.push(made);

  toast(`「${it.title}」已移回待排景點`, "復原", () => { t.itin.splice(Math.min(idx, t.itin.length), 0, it); if (made) t.spots = t.spots.filter((s) => s !== made); save(); render(); });

// 還沒排進行程、也還沒去過的景點(必去優先)
function unsched(t) {
  const used = new Set(t.itin.flatMap((i) => [i.spotId, i.title]).filter(Boolean)), pr = { 必去: 0, 想去: 1, 有空再去: 2 };
  return t.spots.filter((s) => !s.done && !used.has(s.id) && !used.has(s.name)).sort((a, b) => (pr[a.prio] ?? 1) - (pr[b.prio] ?? 1));
}
// 找當天第一個 90 分鐘空檔(避開已排行程、店家沒開的時間), 從 9:00 找到 21:00
function freeSlot(t, d, sp) {
  const busy = t.itin.filter((i) => i.date === d && i.time).map((i) => { const s = toMin(i.time); let e = toMin(i.end); if (e == null || e <= s) e = s + 60; return [s, e]; });
  for (let m = 9 * 60; m <= 21 * 60; m += 30) {
    if (busy.some(([s, e]) => m < e && m + 90 > s)) continue;
    if (hoursWarn({ date: d, time: hm(m), hours: sp.hours }, t)) continue;
    return hm(m);
  }

}

// ===== 自動排順序: 依距離(最近鄰 + 2-opt), 從當天出發的飯店開始, 時間依序重排 =====
function optimizeDay(t, d) {
  const mv = t.itin.filter((i) => i.date === d && i.time && !isMulti(i) && i.lat != null);
  if (mv.length < 3) return alert("這天有定位的行程少於 3 個，不需要排（沒定位的請先到「地圖」按定位）");
  const byT = (a, b) => toMin(a.time) - toMin(b.time), orig = [...mv].sort(byT);
  const h0 = wakeHotel(t, d), p0 = h0 && h0.lat != null ? h0 : null;
  const len = (o) => o.reduce((s, x, i) => s + (i ? distKm(o[i - 1], x) : p0 ? distKm(p0, x) : 0), 0);
  const rest = [...orig], order = [];
  let c = p0 || rest.shift(); if (!p0) order.push(c);
  while (rest.length) { rest.sort((a, b) => distKm(c, a) - distKm(c, b)); c = rest.shift(); order.push(c); }
  for (let pass = 0, better = true; better && pass < 50; pass++) {
    better = false;
    for (let i = p0 ? 0 : 1; i < order.length - 1; i++) for (let j = i + 1; j < order.length; j++) {
      const n = [...order.slice(0, i), ...order.slice(i, j + 1).reverse(), ...order.slice(j + 1)];
      if (len(n) < len(order) - 1e-6) { order.splice(0, order.length, ...n); better = true; }
    }
  }
  const saved = len(orig) - len(order);
  if (saved < 0.05) return toast("目前的順序已經很順了");
  const old = t.itin.filter((i) => i.date === d).map((i) => [i, i.time, i.end, i.travel, i.how, i.ord]);
  let cur = toMin(orig[0].time);
  order.forEach((it, k) => {
    const dur = it.end && toMin(it.end) > toMin(it.time) ? toMin(it.end) - toMin(it.time) : 60;
    if (k && orig.indexOf(order[k - 1]) !== orig.indexOf(it) - 1) { it.travel = ""; it.how = ""; } // 前一站換了, 原本填的交通不適用
    if (k) { const tv = travelMin(order[k - 1], it); cur += tv ? tv.m : 15; cur = Math.ceil(cur / 5) * 5; }
    it.time = hm(cur); if (it.end) it.end = hm(cur + dur); cur += dur;
    placeByTime(t, it);
  });
  save(); render();
  toast(`已依距離重排，少走約 ${fmt(saved, 1)} km`, "復原", () => { old.forEach(([i, a, b, c, e, o]) => Object.assign(i, { time: a, end: b, travel: c, how: e, ord: o })); save(); render(); });
}

  }
  loadRates(true); loadWx(t); loadLeaflet().catch(() => {});
  const fileMsg = `檔案 ${ids.length} 個：本機已有 ${have}、剛下載 ${got}${miss ? `、找不到 ${miss}（可能在別台裝置、沒登入或太大沒同步）` : ""}`;

// ===== 語音記帳: 說「拉麵 980 円」 =====
function cnNum(s) {
  const D = { 零: 0, 一: 1, 二: 2, 兩: 2, 三: 3, 四: 4, 五: 5, 六: 6, 七: 7, 八: 8, 九: 9 }, U = { 十: 10, 百: 100, 千: 1000 };
  let total = 0, sec = 0, n = 0, last = 1;
  for (const c of s) {
    if (c in D) n = D[c];
    else if (c in U) { sec += (n || (c === "十" ? 1 : 0)) * U[c]; last = U[c]; n = 0; }
    else if (c === "萬") { total += (sec + n) * 1e4; sec = 0; n = 0; last = 1e4; }
  }
  if (n && last >= 100 && s.length > 1 && /[百千萬]$/.test(s.slice(0, -1))) n *= last / 10; // 一千二 = 1200
  return total + sec + n;
}
const VCUR = [[/円|日圓|日幣|日元|yen/i, "JPY"], [/台幣|新台幣|塊/, "TWD"], [/韓元|韓幣|원/, "KRW"], [/美金|美元|dollar/i, "USD"], [/泰銖|銖/, "THB"], [/歐元|euro/i, "EUR"], [/港幣/, "HKD"], [/人民幣/, "CNY"]];
const VCAT = [[/車|地鐵|電車|巴士|公車|計程車|taxi|JR|新幹線|交通|票價/i, "交通"], [/伴手禮|土產|お土産|名產/, "伴手禮"], [/門票|入場|門票|纜車/, "門票"], [/藥妝|衣服|鞋|唐吉|ドン|超市|便利商店|買|購物/, "購物"], [/住宿|飯店|旅館/, "住宿"], [/網卡|sim|漫遊/i, "通訊"]];
function parseSpoken(txt, t) {
  let s = txt.replace(/\s+/g, " ").trim(), amt = 0, cur = t.cur;
  for (const [re, c] of VCUR) if (re.test(s)) { cur = c; s = s.replace(re, " "); break; }
  if (/元/.test(s) && cur === t.cur && t.cur !== "TWD" && /台幣/.test(txt)) cur = "TWD";
  s = s.replace(/元/g, " ");
  const m = s.match(/\d[\d,.]*/) ;
  if (m) { amt = parseFloat(m[0].replace(/,/g, "")); s = s.replace(m[0], " "); }
  else { const c = s.match(/[零一二兩三四五六七八九十百千萬]{2,}|[一二兩三四五六七八九十][百千萬十]/); if (c) { amt = cnNum(c[0]); s = s.replace(c[0], " "); } }
  const note = s.replace(/[，,。.、]/g, " ").replace(/\s+/g, " ").trim();
  const cat = (VCAT.find(([re]) => re.test(note)) || [, "餐飲"])[1];
  return { amt, cur, note, cat };
}
function voiceExp(t) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert("這個瀏覽器不支援語音辨識。可以按「＋ 記一筆」，用鍵盤上的 🎤 麥克風說"); return openForm("exp"); }
  const r = new SR(); r.lang = "zh-TW"; r.interimResults = false; r.maxAlternatives = 1;
  toast("🎤 請說，例如「拉麵 980 円」");
  r.onresult = (e) => {
    const txt = e.results[0][0].transcript, p = parseSpoken(txt, t);
    if (!p.amt) return openForm("exp", null, null, { note: p.note || txt, cur: p.cur, cat: p.cat });
    const x = { ...DEFAULTS.exp(), id: uid(), note: p.note, amt: p.amt, cur: p.cur, cat: p.cat };
    t.exp.push(x); save(); render();
    toast(`已記：${p.note || p.cat} ${fmt(p.amt)} ${p.cur}（${p.cat}）`, "復原", () => { t.exp = t.exp.filter((y) => y !== x); save(); render(); });
  };
  r.onerror = (e) => toast(e.error === "not-allowed" ? "麥克風沒有權限：請到瀏覽器設定允許" : e.error === "no-speech" ? "沒聽到聲音，再按一次 🎤" : "語音辨識失敗：" + e.error);
  r.start();
}

    const soon = liveCoupons(t).filter((c) => c.expire && daysLeft(c.expire) <= 3);
    if (soon.length) h += `<h2>🎟 快到期的優惠券</h2>` + soon.map((c) => `<div class="card row" data-act="cpshow" data-id="${c.id}"><span class="sp"><b>${esc(c.title)}</b><div class="mut">${esc(c.store || "")}${c.deal ? "・" + esc(c.deal) : ""}</div></span><span style="color:var(--red);font-weight:700">${expTxt(c.expire)}</span></div>`).join("");

  },
  itin(t) {

      ${mode === "清單" ? '<button class="sm" data-act="hourschk">🕘 檢查營業時間</button><button class="sm" data-act="share">分享</button><button class="sm" data-act="print">列印/PDF</button>' : ""}</div>`;
    if (mode === "景點") return h + `<div class="mut" style="margin-bottom:6px">想去的地方先收在這裡，按「加入行程」或在行事曆裡「排進今天」</div>` + V.spots(t);
    if (mode === "行事曆") return h + calHtml(t);

      return h + `<div class="chips">${[...dates, "全部景點"].map((d) => `<button class="${d === filt.md ? "on" : ""}" data-f="md" data-v="${d}">${d === "全部景點" ? "📍 全部景點" : d.slice(5) + "(" + dayName(d) + ")"}</button>`).join("")}</div>
        <div id="map"></div>
        <div class="row" style="margin-top:6px"><button class="sm" data-act="premap" id="preBtn">🗺 出發前預存地圖</button><span class="mut sp">有網路時自動逐日看一遍，看過的區域離線也能看</span></div>
        <div class="row" style="margin-top:8px"><span class="mut sp">數字＝當天行程順序・🏨＝住宿・橘／紅點＝景點（紅＝必去）${fail ? `・${fail} 個找不到位置` : ""}</span>${miss ? `<button class="sm pri" id="geoBtn" data-act="geoall">📍 定位 ${miss} 個地點</button>` : ""}</div>`;
    }
    if (!t.itin.length) return h + `<div class="empty">還沒有行程，按 ＋ 新增<br>或到上方「📍 景點」把想去的加進來</div>`;
    const by = {};

    return h + `<h2 style="display:none" class="printonly">${esc(t.name)}</h2>` + Object.keys(by).sort().map((d) => {

        (() => { const arr = by[d].sort(byOrd), wh = d !== "未定" && wakeHotel(t, d), sh = d !== "未定" && sleepHotel(t, d);
          return (wh && wh._iid !== arr[0].id ? hotelConn(wh, arr[0], "from") : "") + arr.map((i, n) => (n ? connHtml(arr[n - 1], i) : "") + itinCard(i, arr.length > 1)).join("") + "</div>" + (sh && sh._iid !== arr[arr.length - 1].id ? hotelConn(sh, arr[arr.length - 1], "to") : ""); })();

  },
  spots(t) {
    const cities = [...new Set(t.spots.map((s) => s.city).filter(Boolean))];
    let list = t.spots.filter((s) => (!filt.sc || filt.sc === "全部" || s.cat === filt.sc) && (!filt.city || filt.city === "全部" || s.city === filt.city));
    const pr = { 必去: 0, 想去: 1, 有空再去: 2 };

    return `<div class="row" style="margin-bottom:8px"><button data-act="import">📥 匯入 Google 地圖收藏／連結</button></div>` + chips("sc", SPOT_CATS) + (cities.length > 1 ? chips("city", cities) : "") +
      (list.length ? list.map((s) => `<div class="card ${s.done ? "done" : ""}" data-edit="spots:${s.id}">
        <div class="row"><h3 class="sp">${esc(s.name)}${cpTag(s.name + " " + (s.addr || ""))}</h3><span class="tag">${esc(s.prio)}</span><span class="tag">${esc(s.cat)}</span></div>

  books(t) {

  tickets(t) {

    return head + V.tickets0(t);
  },
  tickets0(t) {
    const list = t.tickets.filter((k) => !filt.tc || filt.tc === "全部" || k.cat === filt.tc).sort((a, b) => !!a.used - !!b.used || (a.date || "z").localeCompare(b.date || "z"));

  },
  exp(t) {
    const tot = (arr) => arr.reduce((s, e) => s + toHome(e.amt, e.cur), 0);
    const total = tot(t.exp);
    const byCat = {}; t.exp.forEach((e) => (byCat[e.cat] = (byCat[e.cat] || 0) + toHome(e.amt, e.cur)));
    const maxC = Math.max(1, ...Object.values(byCat));
    const sub = filt.ex || "記帳";
    const head = `<div class="chips noprint">${["記帳", "收據整理"].map((x) => `<button class="${x === sub ? "on" : ""}" data-f="ex" data-v="${x}">${x === "記帳" ? "💰" : "🧾"} ${x}</button>`).join("")}</div>`;
    if (sub === "收據整理") return head + receiptsHtml(t);
    let h = head + `<div class="row" style="margin-bottom:8px"><label class="btn pri" style="margin:0;color:#fff">📷 拍收據記帳<input type="file" accept="image/*" capture="environment" id="ocrIn" hidden></label><button data-act="voiceexp">🎤 語音記帳</button><span class="mut" id="ocrSt"></span></div>
      <div class="card"><div class="row"><div class="sp"><div class="mut">總花費</div><div class="big">${fmt(total)} <small>${t.home}</small></div></div>
      ${t.budget ? `<div style="text-align:right"><div class="mut">剩餘預算</div><b style="color:${total > t.budget ? "var(--red)" : "inherit"}">${fmt(t.budget - total)}</b></div>` : ""}</div>
      ${t.people.length > 1 ? `<div class="mut">每人平均 ${fmt(total / t.people.length)}</div>` : ""}</div>`;
    h += walletHtml(t) + tcardHtml(t);
    const daily = dailyBudget(t), dsum = (d) => tot(t.exp.filter((e) => e.date === d));
    if (daily) { const td = dsum(today()); h += `<div class="card"><div class="row"><span class="sp">今天花費 <b style="${td > daily ? "color:var(--red)" : ""}">${fmt(td)}</b> / 每日預算 ${fmt(daily)} ${t.home}</span>${td > daily ? '<span class="tag" style="background:var(--red);color:#fff">超支</span>' : ""}</div><div class="bar"><i style="width:${Math.min(100, (td / daily) * 100)}%;${td > daily ? "background:var(--red)" : ""}"></i></div></div>`; }
    const cdays = tripDays(t).length ? tripDays(t) : [...new Set(t.exp.map((e) => e.date).filter(Boolean))].sort();
    if (t.exp.length && cdays.length > 1) h += `<h2>每日花費（${t.home}）</h2><div class="card">${barChart(cdays.map((d) => { const v = dsum(d); return { k: d.slice(5), v, warn: daily && v > daily, tip: `${d}(${dayName(d)})：${fmt(v)} ${t.home}${daily && v > daily ? "・超過每日預算" : ""}` }; }), daily, "每日預算")}</div>`;
    if (Object.keys(byCat).length) h += `<h2>分類（${t.home}）</h2><div class="card"><table>${Object.entries(byCat).sort((a, b) => b[1] - a[1]).map(([c, v]) => `<tr><td style="width:70px">${c}</td><td><div class="bar"><i style="width:${(v / maxC) * 100}%"></i></div></td><td class="r" style="width:90px">${fmt(v)}</td><td class="r mut" style="width:44px">${fmt((v / total) * 100)}%</td></tr>`).join("")}</table></div>`;
    if (t.people.length > 1 && t.exp.length) h += settle(t);
    // 只先顯示最近 80 筆, 其餘按「顯示全部」
    const LIMIT = 80, sorted = t.exp.slice().sort((a, b) => (b.date || "").localeCompare(a.date || ""));
    const shown = filt.expAll ? sorted : sorted.slice(0, LIMIT);
    const by = {}; shown.forEach((e) => (by[e.date || "未定"] ||= []).push(e));
    const dayTot = {}; t.exp.forEach((e) => { const k = e.date || "未定"; dayTot[k] = (dayTot[k] || 0) + toHome(e.amt, e.cur); });
    h += Object.keys(by).sort().reverse().map((d) => `<div class="daybar row"><span class="sp">${d} ${dayName(d) ? "(" + dayName(d) + ")" : ""}</span><span class="mut" style="${daily && dayTot[d] > daily ? "color:var(--red);font-weight:700" : ""}">${fmt(dayTot[d])} ${t.home}${daily && dayTot[d] > daily ? " 超支" : ""}</span></div>` +
      by[d].map((e) => `<div class="card row" data-edit="exp:${e.id}"><div class="sp"><b>${esc(e.note || e.cat)}</b>${e.fileId ? ` <button class="sm" data-act="fopen" data-k="exp" data-id="${e.id}">🧾</button>` : ""}<div class="mut">${esc(e.cat)}・${esc(e.pay || "")}${t.people.length > 1 ? `・${esc(e.payer)}付` : ""}</div></div>
        <div style="text-align:right"><b>${fmt(e.amt, 2)} ${e.cur}</b>${e.cur !== t.home ? `<div class="mut">≈ ${fmt(toHome(e.amt, e.cur))} ${t.home}</div>` : ""}</div></div>`).join("")).join("");
    if (sorted.length > shown.length) h += `<div style="text-align:center;margin:10px 0"><button data-act="expall">顯示全部 ${sorted.length} 筆</button></div>`;
    return h + (t.exp.length ? "" : `<div class="empty">還沒有花費</div>`);
  },
  fx(t) {
    const sub = filt.tool || "匯率";
    const head = `<div class="chips">${["匯率", "商品", "附近", "翻譯", "退稅", "小費", "外語", "緊急", "足跡"].map((x) => `<button class="${x === sub ? "on" : ""}" data-f="tool" data-v="${x}">${x}</button>`).join("")}</div>`;

      <input id="fxC" type="number" inputmode="decimal" step="any" value="1" style="margin-top:8px"><div class="big" id="fxCo" style="margin-top:6px"></div></div>` + fxHistHtml(t);

  pack(t) {

    if (sub === "必買") return head + shopHtml(t);
    if (sub === "出發準備") return head + prepHtml(t);
    return head + packHtml(t);
  },
};

const TOOLS = {
  商品: (t) => scanHtml(t),
  附近: (t) => nearHtml(t),
  翻譯: (t) => trHtml(t),
  足跡: () => fpHtml(),
  匯率: (t) => V.fxRate(t),
  退稅(t) {

      <div class="grid2"><div><label>稅率 %</label><input id="taxV" type="number" step="any" value="${vat}"></div><div><label>手續費（佔退稅額 %）</label><input id="taxF" type="number" step="any" value="${fee}"></div></div>

  小費(t) {

  外語(t) {

      <div class="mut" style="margin-bottom:6px">點句子會放大給對方看，🔊 可以唸出來</div>
      ${t.phr.length ? `<h2>我的句子</h2><div class="card">${t.phr.map((p) => `<div class="phr"><div class="sp" data-big="${esc(p.text)}" data-zh="${esc(p.zh)}" data-lang=""><b>${esc(p.text)}</b><div class="mut">${esc(p.zh)}</div></div><button class="sm" data-edit="phr:${p.id}">✎</button></div>`).join("")}</div>` : ""}
      <h2>常用句</h2><div class="card">${PHRASES.map((p) => `<div class="phr"><div class="sp" data-big="${esc(p[col])}" data-zh="${esc(p[0])}" data-lang="${code}"><b>${esc(p[col])}</b><div class="mut">${esc(p[0])}</div></div><button class="sm" data-say="${esc(p[col])}" data-lang="${code}">🔊</button></div>`).join("")}</div>
      <div class="mut">按 ＋ 可以新增自己的句子（例如飯店地址、過敏食物）</div>`;
  },
  緊急(t) {
    const cc = ccOf(t), list = SOS[cc] || [["緊急（多數國家通用）", "112"]];

    const extra = `${eqHtml(t)}${nOk ? "" : `<div class="card row"><span class="sp mut">🔔 開啟通知：快打烊、地震時跳通知（網頁要開著；iPhone 要先加入主畫面）</span><button class="sm pri" data-act="notifyok">開啟</button></div>`}`

    const after = cards.find((c) => { const r = c.getBoundingClientRect(); return ev.clientY < r.top + r.height / 2; });

    <label>每台裝置每月上限（0 = 不限）</label><input type="number" min="0" step="1" name="gcap" value="${S.gcap == null ? 1000 : S.gcap}">
    <h3 style="margin-top:16px">顯示（這台裝置）</h3>
    <label>風格</label><select name="style">${[["wa", "🎐 和風"], ["plain", "簡約"]].map(([v, n]) => `<option value="${v}" ${(S.style ?? "wa") === v ? "selected" : ""}>${n}</option>`).join("")}</select>
    <div class="grid2" style="grid-template-columns:1fr 1fr 1fr"><div><label>主題</label><select name="theme">${[["", "自動"], ["light", "淺色"], ["dark", "深色"]].map(([v, n]) => `<option value="${v}" ${(S.theme || "") === v ? "selected" : ""}>${n}</option>`).join("")}</select></div>
      <div><label>字體</label><select name="fz">${[["1", "標準"], ["1.15", "大"], ["1.3", "特大"]].map(([v, n]) => `<option value="${v}" ${String(S.fz || 1) === v ? "selected" : ""}>${n}</option>`).join("")}</select></div>
      <div><label>深色時地圖</label><select name="mapc">${[["", "跟著變暗"], ["light", "維持亮色"]].map(([v, n]) => `<option value="${v}" ${(S.mapc || "") === v ? "selected" : ""}>${n}</option>`).join("")}</select></div></div>
    <div class="row" style="margin-top:14px"><button value="deltrip" class="del">刪除此旅程</button><span class="sp"></span><button value="cancel" formnovalidate>取消</button><button value="ok" class="pri">儲存</button></div>`;
  $("#impFile").onchange = async (e) => {
    const file = e.target.files[0]; if (!file) return;
    try {
      const j = JSON.parse(await file.text());
      const trips = j.trips || (j.id ? [j] : null);
      if (!trips) throw new Error("格式不對");
      trips.forEach((x) => { const base = newTrip(); Object.keys(base).forEach((k) => (x[k] ??= base[k])); const i = S.trips.findIndex((y) => y.id === x.id); i >= 0 ? (S.trips[i] = x) : S.trips.push(x); });
      S.cur = trips[0].id; save(); $("#dlg").close("cancel"); render(); alert(`已匯入 ${trips.length} 個旅程`);
    } catch (err) { alert("匯入失敗：" + err.message); }
  };
  const dlg = $("#dlg");
  dlg.onclose = () => {
    const act = dlg.returnValue; dlg.returnValue = "";
    const fd = new FormData(f);
    if (act === "login" || act === "register") {
      const em = fd.get("syncEmail"), pw = fd.get("syncPw");
      if (!em || !pw) return alert("請輸入 Email 和密碼");
      TravelSync[act](em, pw).catch((e) => alert("失敗：" + e.message));
      return;
    }
    if (act === "logout") { TravelSync.logout(); return; }
    if (act === "export") {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([JSON.stringify({ trips: S.trips }, null, 1)], { type: "application/json" }));
      a.download = `travel-backup-${today()}.json`; a.click(); S.lastExport = Date.now(); saveLocal(); render(); return;
    }

    if (act === "deltrip") {
      if (!confirm(`刪除「${t.name}」？無法復原`)) return;
      [...t.tickets, ...t.exp, ...t.shop, ...t.coupons, ...t.diary.flatMap((d) => d.photos)].forEach((k) => { if (k.fileId) { fdel(k.fileId); window.TravelSync && TravelSync.delFile(t, k.fileId); } });
      S.trips = S.trips.filter((x) => x.id !== t.id);
      S.deleted[t.id] = Date.now(); delete snap[t.id];
      window.TravelSync && TravelSync.remove(t.id, S.deleted[t.id]);
      if (!S.trips.length) S.trips.push(newTrip("我的旅程"));
      S.cur = S.trips[0].id; save(); render(); return;
    }
    if (act !== "ok") return;
    const gk = (fd.get("gkey") || "").trim(); if (gk !== (S.gkey || "")) { S.gkey = gk; gErrShown = false; gFail.clear(); S.setMt = Date.now(); }
    const gc = Math.max(0, Math.round(+fd.get("gcap") || 0)); if (gc !== (S.gcap == null ? 1000 : S.gcap)) { S.gcap = gc; gCapShown = false; S.setMt = Date.now(); }
    const rk = (fd.get("rkid") || "").trim(); if (rk !== (S.rkid || "")) { S.rkid = rk; S.setMt = Date.now(); }
    pushSettings();
    S.style = fd.get("style") || "wa"; S.theme = fd.get("theme") || ""; S.fz = +fd.get("fz") || 1; S.mapc = fd.get("mapc") || ""; applyDisplay();
    t.name = fd.get("name").trim() || t.name; t.start = fd.get("start"); t.end = fd.get("end");
    t.cur = fd.get("cur"); t.home = fd.get("home");
    t.manualRate = parseFloat(fd.get("manualRate")) || 0; t.budget = parseFloat(fd.get("budget")) || 0; t.dbudget = parseFloat(fd.get("dbudget")) || 0;
    const ppl = fd.get("people").split(/[,，]/).map((s) => s.trim()).filter(Boolean);
    t.people = ppl.length ? [...new Set(ppl)] : ["我"];
    if (fd.has("share")) {
      const me = TravelSync.user.toLowerCase();
      const list = fd.get("share").split(/[,，;\s]+/).map((x) => x.trim().toLowerCase()).filter((x) => /.+@.+\..+/.test(x));
      if (list.length || t.shared) {
        if (!t.shared) [...t.tickets, ...t.exp, ...t.shop, ...t.coupons, ...t.diary.flatMap((d) => d.photos)].forEach((k) => k.fileId && delete S.upl[k.fileId]); // 檔案改傳到共享區
        t.shared = true; t.emails = [...new Set([me, ...list])];
        setTimeout(() => TravelApp.uploadPending(), 1500);
      }
    }
    const q = (fd.get("city") || "").trim();
    if (q !== (t.loc ? t.loc.q : "")) {
      if (!q) t.loc = null;
      else geoCity(q, t.cur).then((l) => { if (!l) return alert(`找不到「${q}」，換個寫法試試（例如英文）`); t.loc = { ...l, q }; save(); render(); }).catch(() => alert("城市查詢失敗（需要網路）"));
    }
    save(); render();
  };
  dlg.showModal();
}

function applyDisplay() {
  const r = document.documentElement;
  if (S.theme) r.dataset.theme = S.theme; else delete r.dataset.theme;
  if ((S.style ?? "wa") === "wa") r.dataset.style = "wa"; else delete r.dataset.style;
  if (S.mapc) r.dataset.map = S.mapc; else delete r.dataset.map;
  r.style.setProperty("--fz", S.fz || 1);
  document.querySelector('meta[name="theme-color"]').content = getComputedStyle(document.querySelector("header")).backgroundColor;
}
applyDisplay();
const onNet = () => document.body.classList.toggle("off", !navigator.onLine);
addEventListener("online", onNet); addEventListener("offline", onNet); onNet();
// 出發前預存地圖: 依序切到每一天(和全部景點), 讓底圖載入一次
async function preMap(t) {
  if (!navigator.onLine) return alert("要有網路才能預存");
  const dates = [...new Set(t.itin.map((i) => i.date).filter(Boolean))].sort();
  const list = [...dates, "全部景點"], b = () => $("#preBtn");
  for (let i = 0; i < list.length; i++) {
    filt.md = list[i]; render();
    if (b()) b().textContent = `預存中 ${i + 1}/${list.length}…`;
    await new Promise((r) => setTimeout(r, 2500));
    if (window.__map) { window.__map.zoomIn(); await new Promise((r) => setTimeout(r, 1500)); }
  }
  render(); alert("地圖預存完成：剛剛看過的區域，沒網路時也看得到");
}
function syncSection() {
  if (!FIREBASE_CONFIG) return "";
  const ts = window.TravelSync;
  if (!ts) return `<h3 style="margin-top:16px">雲端同步</h3><div class="mut">同步模組載入中（需要網路）</div>`;
  if (ts.user) return `<h3 style="margin-top:16px">雲端同步</h3><div class="mut">已登入 ${esc(ts.user)}・${esc(ts.state)}</div><div class="mut">票券、收據照片也會同步（超過約 700KB 的 PDF 除外）。</div><div class="row" style="margin-top:6px"><button value="logout" formnovalidate>登出</button></div>`;
  return `<h3 style="margin-top:16px">雲端同步</h3><div class="mut">登入後手機、電腦資料自動同步</div>
    <input name="syncEmail" type="email" placeholder="Email" autocomplete="username" style="margin-top:6px"><input name="syncPw" type="password" placeholder="密碼(至少6碼)" autocomplete="current-password" style="margin-top:6px">
    <div class="row" style="margin-top:6px"><button value="login" class="pri" formnovalidate>登入</button><button value="register" formnovalidate>第一次用：註冊</button></div>`;
}
// 給 sync.js 用的介面
window.TravelApp = {
  // 帳號設定(Google 路線金鑰、每月上限、緊急卡資料), 登入同一帳號的裝置共用; mt 新的蓋舊的
  settings: () => ({ gkey: S.gkey || "", gcap: S.gcap ?? 1000, rkid: S.rkid || "", me: S.me || null, mt: S.setMt || 0 }),
  applySettings(d) {
    if (!d || (d.mt || 0) <= (S.setMt || 0)) return false;
    S.gkey = d.gkey || ""; S.gcap = d.gcap ?? 1000; S.rkid = d.rkid || ""; if (d.me) S.me = d.me; S.setMt = d.mt;
    gErrShown = false; gFail.clear(); saveLocal(); if (!$("#dlg").open) render(); return true;
  },
  trips: () => S.trips,
  deleted: () => S.deleted,
  get: (id) => S.trips.find((t) => t.id === id),
  apply(trip) {
    if (S.deleted[trip.id] > (trip.mt || 0)) return;
    const base = newTrip(); Object.keys(base).forEach((k) => (trip[k] ??= base[k]));
    const i = S.trips.findIndex((t) => t.id === trip.id);
    // 新裝置上沒動過的預設旅程, 收到雲端資料時直接拿掉
    const blank = S.trips.length === 1 && !S.trips[0].mt && isBlank(S.trips[0]);
    if (i >= 0) S.trips[i] = trip; else if (blank) { delete snap[S.trips[0].id]; S.trips = [trip]; S.cur = trip.id; } else S.trips.push(trip);
    snap[trip.id] = tripKey(trip);
    saveLocal(); if (!$("#dlg").open) render();
  },
  remove(id) {
    S.trips = S.trips.filter((t) => t.id !== id); delete snap[id];
    if (!S.trips.length) S.trips.push(newTrip("我的旅程"));
    saveLocal(); if (!$("#dlg").open) render();
  },
  isBlank: (t) => isBlank(t),
  async uploadPending() {
    if (!window.TravelSync || !TravelSync.user) return;
    for (const t of S.trips) for (const it of [...t.tickets, ...t.exp, ...t.shop, ...t.coupons, ...t.diary.flatMap((d) => d.photos)]) {
      if (!it.fileId || S.upl[it.fileId]) continue;
      const b = await fget(it.fileId); if (!b) continue;
      try { const r = await TravelSync.putFile(t, it.fileId, b); if (r) { S.upl[it.fileId] = r === true ? 1 : "big"; saveLocal(); } } catch (e) { }
    }
  },
};
function isBlank(t) { return ["itin", "spots", "books", "tickets", "exp", "pack"].every((k) => !t[k].length) && !t.start; }

for (const t of S.trips) snap[t.id] = tripKey(t);
setTimeout(() => S.trips.forEach((t) => {
  const want = CUR2CC[t.cur];
  if (t.loc && t.loc.q && want && want !== "TW" && t.loc.cc && t.loc.cc !== want)
    geoCity(t.loc.q, t.cur).then((l) => { if (l && l.cc === want) { t.loc = { ...l, q: t.loc.q }; save(); render(); } }).catch(() => {});
}), 500);
// 舊資料沒有mt: 有內容的給1(要上傳), 沒動過的預設旅程給0(不上傳)
for (const t of S.trips) t.mt ||= isBlank(t) ? 0 : 1;
render();
loadRates();
// 同步模組要網路才載得到; 離線開啟的話, 等恢復網路再載
let syncLoaded = false;
const loadSync = () => { if (!FIREBASE_CONFIG || syncLoaded) return; import("./sync.js").then((m) => { syncLoaded = true; m.start(FIREBASE_CONFIG); }).catch(() => {}); };
loadSync(); addEventListener("online", loadSync);
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
  navigator.serviceWorker.addEventListener("message", (e) => { if (e.data && e.data.type === "updated") toast("有新版本", "更新", () => location.reload()); });
}
</script>
</body>
</html>
